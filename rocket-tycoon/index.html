<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05070f">
<meta name="format-detection" content="telephone=no">
<title>🚀 로켓 타이쿤 — 사파리 미니 테스트판</title>
<style>
  :root{
    --gold:#ffc93c; --gold2:#ff9f1c; --green:#39d98a; --blue:#5b8cff; --violet:#a97bff;
    --txt:#eaf1ff; --dim:#8ea1c4; --line:rgba(122,162,255,.16);
    --panel:linear-gradient(180deg,rgba(26,37,66,.96),rgba(15,23,44,.96));
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:#05070f; color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
    overflow:hidden; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    touch-action:manipulation; font-synthesis:none;
  }
  button{font-family:inherit; border:0; background:none; color:inherit; cursor:pointer; -webkit-appearance:none; appearance:none;}
  #app{
    position:fixed; inset:0;
    display:flex; flex-direction:column; gap:7px;
    padding:7px 10px 8px;
    background:
      radial-gradient(120% 55% at 50% -8%, #1b2a55 0%, #0b1226 48%, #05070f 100%);
  }

  /* ---------- HUD ---------- */
  .hud{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:7px 12px; border-radius:15px; border:1px solid var(--line);
    background:linear-gradient(180deg,rgba(30,42,76,.96),rgba(16,24,46,.96));
    box-shadow:0 8px 22px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.07);
    flex:0 0 auto;
  }
  .cashblk .k{display:block; font-size:9.5px; font-weight:800; letter-spacing:.14em; color:var(--dim);}
  .cashblk strong{
    display:block; font-size:26px; line-height:1.1; font-weight:900; color:var(--gold);
    font-variant-numeric:tabular-nums; letter-spacing:-.01em;
    text-shadow:0 0 18px rgba(255,201,60,.4);
    transition:transform .18s;
  }
  .cashblk.bump strong{transform:scale(1.06);}
  .statblk{display:flex; gap:15px; text-align:right;}
  .stat b{display:block; font-size:14.5px; font-weight:800; color:#d3e2ff; font-variant-numeric:tabular-nums; line-height:1.2;}
  .stat span{display:block; font-size:9px; letter-spacing:.04em; color:var(--dim); margin-top:1px;}

  /* ---------- gamepass toggles ---------- */
  .passrow{display:flex; gap:7px; flex:0 0 auto;}
  .pass{
    flex:1; display:flex; align-items:center; gap:7px; height:37px; padding:0 10px;
    border-radius:12px; border:1px solid var(--line); background:rgba(16,24,44,.9);
    color:#9fb0cd; font-size:11.5px; font-weight:800; transition:background .18s, border-color .18s, color .18s;
  }
  .pass .pdot{width:8px; height:8px; border-radius:50%; background:#36456a; flex:0 0 auto; transition:.18s;}
  .pass .pstate{
    margin-left:auto; font-size:9.5px; font-weight:900; letter-spacing:.06em;
    padding:2px 6px; border-radius:6px; background:rgba(255,255,255,.06); color:#7f90b0;
  }
  .pass.on{
    border-color:rgba(61,217,138,.5); color:#c9ffe6;
    background:linear-gradient(180deg,rgba(22,68,52,.95),rgba(13,42,32,.95));
    box-shadow:0 0 14px rgba(61,217,138,.18) inset;
  }
  .pass.on .pdot{background:var(--green); box-shadow:0 0 9px rgba(61,217,138,.95);}
  .pass.on .pstate{background:rgba(61,217,138,.2); color:#9dffcd;}
  .pass:active{transform:scale(.985);}

  /* ---------- stage ---------- */
  .stage{
    position:relative; flex:1 1 0; min-height:168px; border-radius:16px; overflow:hidden;
    border:1px solid var(--line);
    background:radial-gradient(140% 95% at 50% 108%, #1c2b58 0%, #0a1230 52%, #05080f 100%);
    box-shadow:inset 0 0 60px rgba(30,60,140,.25);
  }
  .stars{position:absolute; inset:0; pointer-events:none;}
  .stars i{position:absolute; border-radius:50%; background:#d6e6ff; animation:tw 3.6s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.25;}50%{opacity:1;}}
  .moon{
    position:absolute; right:18px; top:54px; width:34px; height:34px; border-radius:50%;
    background:radial-gradient(circle at 32% 30%, #fff8e2, #ffd88a 55%, #c99a3d 100%);
    box-shadow:0 0 26px rgba(255,214,140,.45), 0 0 70px rgba(255,190,90,.18);
    opacity:.85;
  }
  .moon::after{
    content:""; position:absolute; left:-7px; top:-5px; width:14px; height:14px; border-radius:50%;
    background:rgba(140,110,60,.25);
  }
  .grd{
    position:absolute; left:-10%; right:-10%; bottom:56px; height:64px; pointer-events:none;
    background:radial-gradient(60% 100% at 50% 100%, rgba(70,120,220,.22), rgba(70,120,220,0) 70%);
    border-top:1px solid rgba(120,170,255,.14);
  }
  .pips{position:absolute; left:10px; top:10px; display:flex; gap:5px; align-items:center; z-index:4;}
  .pips i{
    width:16px; height:5px; border-radius:3px; background:rgba(255,255,255,.13);
    transition:background .3s, box-shadow .3s;
  }
  .pips i.on{background:var(--gold); box-shadow:0 0 8px rgba(255,201,60,.8);}
  .tools{position:absolute; right:8px; top:8px; display:flex; gap:6px; z-index:4;}
  .tool{
    width:30px; height:30px; border-radius:9px; font-size:13px; line-height:1;
    background:rgba(12,20,38,.75); border:1px solid var(--line); color:#b9c9e6;
    display:grid; place-items:center;
  }
  .tool:active{background:rgba(40,60,110,.9);}

  .rig{
    position:absolute; left:50%; bottom:58px; transform:translateX(-50%);
    height:calc(100% - 66px); max-height:330px;
    pointer-events:none;
  }
  #rigPad{z-index:1;}
  #rigRocket{z-index:2;}
  .fly{height:100%; will-change:transform,opacity; transform-origin:50% 92%;}
  #rocket,#padSvg{height:100%; width:auto; aspect-ratio:200/340; display:block; overflow:visible;}
  #rocket{filter:drop-shadow(0 10px 18px rgba(0,0,0,.45));}
  .part{opacity:0; transform-box:fill-box; -webkit-transform-box:fill-box;
    transform-origin:center center; transition:opacity .3s ease;}
  .part.on{opacity:1;}
  .part.pop{animation:pop .5s cubic-bezier(.2,1.5,.5,1);}
  @keyframes pop{0%{opacity:0; transform:scale(.82) translateY(6px);}60%{opacity:1; transform:scale(1.05);}100%{opacity:1; transform:scale(1);}}
  #flame{opacity:0; transition:opacity .16s; transform-box:fill-box; -webkit-transform-box:fill-box; transform-origin:50% 0%;}
  .lit #flame{opacity:1; animation:flick .12s infinite alternate;}
  @keyframes flick{from{transform:scaleY(.9);}to{transform:scaleY(1.12);}}

  .fx{position:absolute; inset:0; pointer-events:none; z-index:3; overflow:hidden;}
  .pt{position:absolute; border-radius:50%; will-change:transform,opacity;}

  .cd{
    position:absolute; left:50%; top:34%; transform:translate(-50%,-50%) scale(.4);
    font-size:78px; font-weight:900; color:#fff; opacity:0; z-index:6; pointer-events:none;
    text-shadow:0 0 30px rgba(120,180,255,.9), 0 6px 0 rgba(0,0,0,.25);
    letter-spacing:-.03em;
  }
  .cd.pop{animation:cdpop .92s ease-out forwards;}
  @keyframes cdpop{
    0%{opacity:0; transform:translate(-50%,-50%) scale(1.85);}
    18%{opacity:1; transform:translate(-50%,-50%) scale(1);}
    72%{opacity:1; transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0; transform:translate(-50%,-50%) scale(.8);}
  }
  .reward{
    position:absolute; left:50%; top:30%; transform:translate(-50%,-50%);
    font-size:29px; font-weight:900; color:#ffd35c; z-index:7; pointer-events:none; white-space:nowrap;
    text-shadow:0 0 26px rgba(255,195,50,.9), 0 3px 0 rgba(0,0,0,.35);
  }
  .toast{
    position:absolute; left:50%; top:46px; transform:translateX(-50%) translateY(-8px);
    max-width:80%; padding:6px 13px; border-radius:10px; z-index:7; pointer-events:none;
    background:rgba(9,15,30,.9); border:1px solid var(--line);
    font-size:11.5px; font-weight:700; color:#d7e4ff; text-align:center; opacity:0;
    transition:opacity .25s, transform .25s;
    box-shadow:0 8px 22px rgba(0,0,0,.5);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .flash{
    position:absolute; inset:0; z-index:5; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 74%, rgba(255,232,170,.9), rgba(255,170,60,0) 62%);
  }
  .flash.on{animation:flashin .45s ease-out;}
  @keyframes flashin{0%{opacity:0;}18%{opacity:.95;}100%{opacity:0;}}

  .launch{
    position:absolute; left:10px; right:10px; bottom:7px; height:42px; z-index:5;
    border-radius:13px; font-size:15.5px; font-weight:900; letter-spacing:.01em;
    background:linear-gradient(180deg,#ff7264,#df3b2e); color:#fff;
    box-shadow:0 8px 20px rgba(223,59,46,.38), inset 0 1px 0 rgba(255,255,255,.32);
    transition:transform .12s, box-shadow .2s, background .2s;
  }
  .launch:active:not(:disabled){transform:scale(.98);}
  .launch:disabled{
    background:linear-gradient(180deg,rgba(38,52,86,.95),rgba(22,31,54,.95)); color:#8092b4;
    box-shadow:none; border:1px solid var(--line); font-size:13px;
  }
  .launch.ready{animation:lpulse 1.5s ease-in-out infinite;}
  @keyframes lpulse{
    0%,100%{box-shadow:0 8px 20px rgba(223,59,46,.35), inset 0 1px 0 rgba(255,255,255,.3);}
    50%{box-shadow:0 8px 30px rgba(255,110,90,.8), 0 0 0 3px rgba(255,110,90,.14), inset 0 1px 0 rgba(255,255,255,.35);}
  }
  .shake{animation:shk .45s;}
  @keyframes shk{
    0%,100%{transform:translate(0,0);}
    20%{transform:translate(-3px,2px);}
    40%{transform:translate(3px,-2px);}
    60%{transform:translate(-2px,-1px);}
    80%{transform:translate(2px,1px);}
  }

  /* ---------- factory ---------- */
  .factory{display:flex; flex-direction:column; gap:6px; flex:0 0 auto;}
  .frow{position:relative; display:flex; align-items:flex-end; gap:7px; height:72px;}
  .beltwrap{position:relative; flex:1 1 auto; height:72px; min-width:0;}
  .dropper{position:absolute; left:2px; top:0; width:42px; height:40px; z-index:2;}
  .dhead{
    position:absolute; left:0; top:0; width:34px; height:30px; border-radius:9px;
    background:linear-gradient(180deg,#3d4a6d,#232c44); border:1px solid rgba(140,170,230,.35);
    display:grid; place-items:center; font-size:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .dchute{
    position:absolute; left:9px; top:28px; width:16px; height:12px;
    background:linear-gradient(180deg,#2b3550,#161d31);
    clip-path:polygon(0 0,100% 0,74% 100%,26% 100%);
    border-bottom:1px solid rgba(140,170,230,.3);
  }
  .dropper.drop{animation:dshk .26s;}
  @keyframes dshk{0%,100%{transform:translateY(0);}40%{transform:translateY(3px);}}
  .dropper.drop .dchute{background:linear-gradient(180deg,#5b7bc4,#2b3550);}

  .belt{
    position:absolute; left:0; right:0; bottom:2px; height:34px; border-radius:8px;
    background:linear-gradient(180deg,#1b2338,#0e1424);
    border:1px solid rgba(120,160,230,.2); overflow:hidden;
    box-shadow:inset 0 6px 12px rgba(0,0,0,.55);
  }
  .bsurf{
    position:absolute; left:0; right:0; top:6px; bottom:6px; opacity:.5;
    background:repeating-linear-gradient(90deg, rgba(120,160,230,.45) 0 6px, rgba(120,160,230,0) 6px 16px);
    animation:beltmove var(--bdur,1s) linear infinite;
  }
  @keyframes beltmove{from{background-position-x:0;}to{background-position-x:16px;}}
  .belt::after{
    content:""; position:absolute; left:0; right:0; top:0; height:5px;
    background:linear-gradient(90deg,rgba(255,255,255,.10),rgba(255,255,255,.02));
  }
  .ores{position:absolute; inset:0; overflow:hidden;}
  .ore{
    position:absolute; left:0; top:50%; margin-top:-11px; width:22px; height:22px;
    display:grid; place-items:center; font-size:13px; line-height:1; border-radius:6px;
    will-change:transform;
    background:rgba(120,160,230,.14); border:1px solid rgba(140,180,255,.28);
    box-shadow:0 2px 6px rgba(0,0,0,.45);
  }
  .ore.gem{background:rgba(90,200,255,.2); border-color:rgba(120,220,255,.55); box-shadow:0 0 10px rgba(90,200,255,.55);}
  .ore.rare{background:rgba(180,120,255,.24); border-color:rgba(200,150,255,.75); box-shadow:0 0 14px rgba(180,120,255,.8);}

  .bin{position:relative; width:56px; height:66px; flex:0 0 auto;}
  .bin .bbox{
    position:absolute; left:0; bottom:0; width:56px; height:46px; border-radius:9px 9px 7px 7px;
    background:linear-gradient(180deg,#584a22,#2c240f);
    border:1px solid rgba(255,201,60,.45); display:grid; place-items:center; font-size:19px;
    box-shadow:inset 0 2px 0 rgba(255,220,120,.25), 0 5px 14px rgba(0,0,0,.45);
    overflow:hidden;
  }
  .bin .bbox span{transform:translateY(2px); opacity:.95;}
  .bin .bamt{
    position:absolute; left:50%; top:2px; transform:translateX(-50%);
    font-size:10.5px; font-weight:900; color:#3a2a00; white-space:nowrap;
    background:linear-gradient(180deg,#ffe083,#ffbf2e); border-radius:7px; padding:2px 7px;
    box-shadow:0 2px 8px rgba(255,190,50,.5); font-variant-numeric:tabular-nums;
    transition:transform .15s;
  }
  .bin.hot .bamt{transform:translateX(-50%) scale(1.1);}
  .bin.hot .bbox{box-shadow:inset 0 2px 0 rgba(255,220,120,.4), 0 0 18px rgba(255,190,50,.55);}

  .collect{
    height:43px; border-radius:13px; display:flex; align-items:center; justify-content:center; gap:10px;
    font-size:15px; font-weight:900; color:#3a2500;
    background:linear-gradient(180deg,#ffd863,#f2a81c);
    box-shadow:0 7px 18px rgba(242,168,28,.3), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .1s, background .2s, color .2s, box-shadow .2s;
  }
  .collect b{font-size:16px; font-variant-numeric:tabular-nums;}
  .collect:active:not(:disabled){transform:scale(.985);}
  .collect:disabled{
    background:linear-gradient(180deg,rgba(34,46,78,.95),rgba(21,30,52,.95));
    color:#7183a6; box-shadow:none; border:1px solid var(--line);
  }
  .collect.auto{
    background:linear-gradient(180deg,#3fd48c,#1f9d64); color:#03220f;
    border:1px solid rgba(120,255,190,.4);
    box-shadow:0 7px 18px rgba(31,157,100,.35), inset 0 1px 0 rgba(255,255,255,.4);
  }

  /* ---------- shop ---------- */
  .shop{display:flex; flex-direction:column; gap:6px; flex:0 1 auto; min-height:120px; max-height:43vh;}
  .tabs{display:flex; gap:4px; padding:4px; border-radius:12px; background:rgba(10,16,32,.92); border:1px solid var(--line); flex:0 0 auto;}
  .tab{
    flex:1; height:31px; border-radius:9px; font-size:11.5px; font-weight:800; color:#8496b8;
    display:flex; align-items:center; justify-content:center; gap:5px; transition:.16s;
  }
  .tab.on{background:linear-gradient(180deg,#2f4f8f,#1d3161); color:#eaf1ff; box-shadow:0 2px 10px rgba(60,120,255,.3);}
  .tab b{font-size:10px; opacity:.85;}
  .list{display:flex; flex-direction:column; gap:6px; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-right:1px; flex:1 1 auto;}
  .card{
    display:flex; align-items:center; gap:9px; width:100%; min-height:50px; padding:0 10px;
    border-radius:12px; border:1px solid var(--line); text-align:left;
    background:linear-gradient(180deg,rgba(28,40,70,.95),rgba(16,24,45,.95));
    transition:transform .1s, border-color .2s, opacity .2s;
  }
  .card:active{transform:scale(.988);}
  .cicon{
    width:30px; height:30px; flex:0 0 auto; border-radius:9px; display:grid; place-items:center; font-size:15px;
    background:rgba(90,130,255,.12); border:1px solid rgba(90,130,255,.18);
  }
  .cmain{min-width:0; flex:1 1 auto;}
  .cname{font-size:12.5px; font-weight:800; color:#eaf1ff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cname .lv{font-size:9.5px; font-weight:800; color:var(--blue); margin-left:4px;}
  .cdesc{font-size:10px; color:var(--dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cbuy{margin-left:auto; text-align:right; flex:0 0 auto; min-width:58px;}
  .cbuy .price{display:block; font-size:12.5px; font-weight:900; color:var(--gold); font-variant-numeric:tabular-nums;}
  .cbuy .lk{display:block; font-size:9px; color:#7f90b0; margin-top:1px;}
  .cbuy .done{font-size:11.5px; font-weight:900; color:var(--green);}
  .cbuy .lock{font-size:12px; opacity:.6;}
  .card.poor .cbuy .price{color:#ff7d7d;}
  .card.poor .cdesc{color:#7a6a7a;}
  .card.done{opacity:.55;}
  .card.locked{opacity:.42;}
  .card.na{opacity:.4;}

  /* coins flying to the HUD */
  .coin{
    position:fixed; width:13px; height:13px; border-radius:50%; z-index:90; pointer-events:none;
    background:radial-gradient(circle at 34% 30%,#fff6c0,#ffc93c 55%,#dd8c00);
    box-shadow:0 0 10px rgba(255,201,60,.85);
    transform:translate(-50%,-50%);
  }
  @media (max-height:700px){
    .hud{padding:5px 10px;}
    .cashblk strong{font-size:22px;}
    .pass{height:33px; font-size:10.5px;}
    .stage{min-height:140px;}
    .frow{height:64px;}
    .shop{max-height:40vh; min-height:104px;}
    .card{min-height:46px;}
  }
  @media (max-height:620px){
    .moon{display:none;}
    .statblk .stat:first-child{display:none;}
  }
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="cashblk" id="cashBlk">
      <span class="k">보유 캐시</span>
      <strong id="cashVal">$0</strong>
    </div>
    <div class="statblk">
      <div class="stat"><b id="rateVal">$0</b><span>수익 /초</span></div>
      <div class="stat"><b id="launchVal">0</b><span>발사 횟수</span></div>
    </div>
  </header>

  <div class="passrow">
    <button class="pass" id="passX2" type="button">
      <i class="pdot"></i><span>2배 수익 패스</span><b class="pstate">OFF</b>
    </button>
    <button class="pass" id="passAuto" type="button">
      <i class="pdot"></i><span>자동 수거 패스</span><b class="pstate">OFF</b>
    </button>
  </div>

  <section class="stage" id="stage">
    <div class="stars" id="stars"></div>
    <div class="moon"></div>
    <div class="grd"></div>

    <div class="pips" id="pips">
      <i data-p="pad"></i><i data-p="tank"></i><i data-p="booster"></i><i data-p="body"></i><i data-p="nose"></i>
    </div>
    <div class="tools">
      <button class="tool" id="soundBtn" type="button" aria-label="소리 켜기/끄기">🔊</button>
      <button class="tool" id="resetBtn" type="button" aria-label="초기화">↺</button>
    </div>

    <div class="rig" id="rigPad">
      <svg id="padSvg" viewBox="0 0 200 340" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="gPad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#616d8d"/><stop offset="100%" stop-color="#20263a"/>
          </linearGradient>
        </defs>
        <!-- 조립 전 청사진 -->
        <g id="ghost" opacity=".2" fill="none" stroke="#8fb4ff" stroke-width="2" stroke-dasharray="7 7" stroke-linecap="round">
          <path d="M46 306 h108"/>
          <rect x="76" y="228" width="48" height="64" rx="9"/>
          <rect x="54" y="244" width="21" height="48" rx="8"/>
          <rect x="125" y="244" width="21" height="48" rx="8"/>
          <rect x="74" y="126" width="52" height="106" rx="6"/>
          <path d="M76 128 L100 50 L124 128"/>
        </g>
        <!-- 발사대 -->
        <g class="part" id="pPad">
          <rect x="150" y="146" width="7" height="152" rx="3" fill="#39425c"/>
          <rect x="146" y="192" width="15" height="5" rx="2" fill="#5c6684"/>
          <rect x="146" y="232" width="15" height="5" rx="2" fill="#5c6684"/>
          <path d="M150 236 H128" stroke="#5c6684" stroke-width="4" stroke-linecap="round"/>
          <ellipse cx="100" cy="309" rx="60" ry="7" fill="#05080f" opacity=".6"/>
          <rect x="46" y="298" width="108" height="14" rx="5" fill="url(#gPad)"/>
          <rect x="46" y="298" width="108" height="4" rx="2" fill="#7e8aab"/>
          <rect x="54" y="312" width="9" height="22" rx="3" fill="#2a3145"/>
          <rect x="137" y="312" width="9" height="22" rx="3" fill="#2a3145"/>

<script>
(function () {
  'use strict';

  /* =========================================================
     설정
     ========================================================= */
  var SAVE_KEY = 'rocketTycoonSafariMini_v1';
  var START_CASH = 300;
  var AUTO_SECONDS = 2;          // 자동 수거 주기
  var MAX_ORES = 70;

  var PARTS = [
    { id: 'pad',     name: '발사대',    icon: '🛠️', price: 60,  desc: '로켓을 세우는 발사 플랫폼' },
    { id: 'tank',    name: '연료 탱크', icon: '🛢️', price: 140, desc: '추진제를 채우는 탱크' },
    { id: 'booster', name: '부스터',    icon: '🔥', price: 240, desc: '이륙 추력을 만드는 보조 엔진' },
    { id: 'body',    name: '동체',      icon: '🚀', price: 360, desc: '몸통과 조종석 조립' },
    { id: 'nose',    name: '노즈콘',    icon: '🔺', price: 520, desc: '대기권을 뚫는 선두부' }
  ];
  var ORDER = PARTS.map(function (p) { return p.id; });
  var SVG_ID = { pad: 'pPad', tank: 'pTank', booster: 'pBooster', body: 'pBody', nose: 'pNose' };

  var UPGRADES = [
    { id: 'drill',  name: '드릴 강화',     icon: '⛏️', desc: '광석 가치 상승',
      levels: [{ price: 120, add: 6, label: '+6' }, { price: 520, add: 14, label: '+14' }, { price: 2200, add: 40, label: '+40' }] },
    { id: 'speed',  name: '컨베이어 가속', icon: '⚡', desc: '생산·이동 속도 상승',
      levels: [{ price: 280, label: '+18%' }, { price: 1400, label: '+18%' }] },
    { id: 'line',   name: '드릴 라인 추가', icon: '🏭', desc: '한 번에 광석 +1개',
      levels: [{ price: 800, label: '+1개' }, { price: 3200, label: '+1개' }] },
    { id: 'launch', name: '발사 보상 강화', icon: '💰', desc: '발사 성공 보상 증가',
      levels: [{ price: 900, add: 250, label: '+$250' }, { price: 3600, add: 700, label: '+$700' }] }
  ];

  var ORE_TYPES = [
    { w: 62, mult: 1,   icon: '🪨', cls: 'rock' },
    { w: 28, mult: 2.5, icon: '💎', cls: 'gem'  },
    { w: 10, mult: 8,   icon: '💠', cls: 'rare' }
  ];

  /* =========================================================
     도우미
     ========================================================= */
  function $(id) { return document.getElementById(id); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function money(n) {
    n = Math.floor(n || 0);
    if (n >= 1000000000) return '$' + (n / 1000000000).toFixed(2) + 'B';
    if (n >= 100000000) return '$' + (n / 1000000).toFixed(1) + 'M';
    return '$' + n.toLocaleString('en-US');
  }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  /* =========================================================
     저장 상태
     ========================================================= */
  function defaultState() {
    return {
      cash: START_CASH,
      launches: 0,
      pending: 0,
      parts: { pad: false, tank: false, booster: false, body: false, nose: false },
      ups: { drill: 0, speed: 0, line: 0, launch: 0 },
      passX2: false,
      passAuto: false,
      sound: true,
      earned: 0,
      seen: false
    };
  }

  var state = defaultState();

  function loadState() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      var d = JSON.parse(raw);
      if (!d || typeof d !== 'object') return false;
      var s = defaultState();
      if (typeof d.cash === 'number' && isFinite(d.cash)) s.cash = Math.max(0, d.cash);
      if (typeof d.launches === 'number' && isFinite(d.launches)) s.launches = Math.max(0, Math.floor(d.launches));
      if (typeof d.pending === 'number' && isFinite(d.pending)) s.pending = Math.max(0, d.pending);
      if (typeof d.earned === 'number' && isFinite(d.earned)) s.earned = Math.max(0, d.earned);
      if (d.parts && typeof d.parts === 'object') {
        ORDER.forEach(function (id) { if (typeof d.parts[id] === 'boolean') s.parts[id] = d.parts[id]; });
      }
      if (d.ups && typeof d.ups === 'object') {
        UPGRADES.forEach(function (u) {
          var lv = d.ups[u.id];
          if (typeof lv === 'number' && isFinite(lv)) s.ups[u.id] = clamp(Math.floor(lv), 0, u.levels.length);
        });
      }
      s.passX2 = !!d.passX2;
      s.passAuto = !!d.passAuto;
      s.sound = d.sound !== false;
      s.seen = !!d.seen;
      state = s;
      return true;
    } catch (e) { return false; }
  }

  function saveState() {
    try {
      state.pending = Math.max(0, state.pending);
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    } catch (e) { /* 저장 실패는 무시 */ }
  }

  var hadSave = loadState();

  /* =========================================================
     사운드 (외부 파일 없이 WebAudio)
     ========================================================= */
  var Sound = (function () {
    var ctx = null, master = null, noiseBuf = null, muted = !state.sound;

    function ensure() {
      if (muted) return null;
      try {
        if (!ctx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ctx = new AC();
          master = ctx.createGain();
          master.gain.value = 0.45;
          master.connect(ctx.destination);
        }
        if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
        return ctx;
      } catch (e) { return null; }
    }

    function tone(freq, dur, type, vol, delay) {
      var c = ensure(); if (!c) return;
      try {
        var t0 = c.currentTime + (delay || 0);
        var o = c.createOscillator(), g = c.createGain();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(freq, t0);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g); g.connect(master);
        o.start(t0); o.stop(t0 + dur + 0.05);
      } catch (e) {}
    }

    function noise(dur, vol, freq) {
      var c = ensure(); if (!c) return;
      try {
        if (!noiseBuf) {
          noiseBuf = c.createBuffer(1, Math.floor(c.sampleRate * 2), c.sampleRate);
          var d = noiseBuf.getChannelData(0);
          for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        var src = c.createBufferSource(); src.buffer = noiseBuf;
        var f = c.createBiquadFilter(); f.type = 'lowpass';
        f.frequency.setValueAtTime(freq || 900, c.currentTime);
        f.frequency.exponentialRampToValueAtTime(120, c.currentTime + dur);
        var g = c.createGain();
        g.gain.setValueAtTime(vol || 0.2, c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
        src.connect(f); f.connect(g); g.connect(master);
        src.start(); src.stop(c.currentTime + dur);
      } catch (e) {}
    }

    return {
      unlock: function () { ensure(); },
      setMuted: function (v) { muted = v; if (!v) ensure(); },
      isMuted: function () { return muted; },
      coin: function () { tone(980, 0.08, 'triangle', 0.10); tone(1420, 0.10, 'triangle', 0.07, 0.05); },
      build: function () { tone(320, 0.07, 'square', 0.07); tone(560, 0.10, 'square', 0.06, 0.07); },
      beep: function () { tone(620, 0.11, 'square', 0.07); },
      go: function () { tone(1050, 0.28, 'sawtooth', 0.09); },
      rumble: function () { noise(1.8, 0.30, 1200); },
      win: function () { tone(660, 0.12, 'triangle', 0.11); tone(880, 0.12, 'triangle', 0.10, 0.11); tone(1320, 0.30, 'triangle', 0.10, 0.22); },
      fail: function () { tone(180, 0.14, 'sawtooth', 0.07); }
    };
  })();

  /* =========================================================
     DOM
     ========================================================= */
  var appEl = $('app'), stageEl = $('stage'), cashEl = $('cashVal'), cashBlk = $('cashBlk');
  var rateEl = $('rateVal'), launchValEl = $('launchVal');
  var passX2El = $('passX2'), passAutoEl = $('passAuto');
  var launchBtn = $('launchBtn'), launchLabel = $('launchLabel');
  var beltEl = $('belt'), oresEl = $('ores'), binEl = $('bin'), binAmtEl = $('binAmt');
  var collectBtn = $('collectBtn'), collectAmtEl = $('collectAmt'), collectLabel = $('collectLabel');
  var listEl = $('list'), partCountEl = $('partCount');
  var flyEl = $('fly'), rocketSvg = $('rocket'), padSvg = $('padSvg'), cdEl = $('cd'), toastEl = $('toast'), fxEl = $('fx'), flashEl = $('flash');
  var dropperEl = $('dropper'), pipsEl = $('pips'), soundBtn = $('soundBtn'), resetBtn = $('resetBtn');
  var ghostEl = $('ghost');

  /* 별 배경 */
  (function stars() {
    var html = '';
    for (var i = 0; i < 46; i++) {
      var s = (Math.random() * 1.7 + 0.9).toFixed(1);
      html += '<i style="left:' + (Math.random() * 100).toFixed(2) + '%;top:' +
        (Math.random() * 68).toFixed(2) + '%;width:' + s + 'px;height:' + s +
        'px;animation-delay:' + (Math.random() * 4).toFixed(2) + 's;opacity:' +
        (0.25 + Math.random() * 0.6).toFixed(2) + '"></i>';
    }
    $('stars').innerHTML = html;
  })();

  /* =========================================================
     파생 값
     ========================================================= */
  function upLevel(id) { return state.ups[id] || 0; }
  function drillBonus() {
    var v = 0, lv = upLevel('drill');
    for (var i = 0; i < lv; i++) v += UPGRADES[0].levels[i].add;
    return v;
  }
  function launchBonus() {
    var v = 0, lv = upLevel('launch');
    for (var i = 0; i < lv; i++) v += UPGRADES[3].levels[i].add;
    return v;
  }
  function speedMul() { return Math.pow(0.84, upLevel('speed')); }
  function spawnInterval() { return 1.85 * speedMul(); }
  function travelTime() { return 4.4 * speedMul(); }
  function lineCount() { return 1 + upLevel('line'); }
  function builtCount() {
    var n = 0;
    for (var i = 0; i < ORDER.length; i++) if (state.parts[ORDER[i]]) n++;
    return n;
  }
  function oreValue(mult) {
    var v = (8 + drillBonus() + Math.random() * 4) * mult;
    if (state.passX2) v *= 2;
    return Math.max(1, Math.round(v));
  }
  function launchReward() {
    var v = (500 + launchBonus()) * (1 + state.launches * 0.25);
    if (state.passX2) v *= 2;
    return Math.round(v);
  }

  /* =========================================================
     컨베이어 / 광석
     ========================================================= */
  var ores = [];
  var oreW = 200;        // 벨트 폭(px)
  var spawnAcc = 0;
  var autoAcc = 0;
  var recent = [];       // 최근 수익 기록(초당 계산)
  var paused = false;

  function measure() {
    oreW = Math.max(60, beltEl.clientWidth - 6);
  }

  function pickType() {
    var total = 0, i;
    for (i = 0; i < ORE_TYPES.length; i++) total += ORE_TYPES[i].w;
    var r = Math.random() * total;
    for (i = 0; i < ORE_TYPES.length; i++) {
      r -= ORE_TYPES[i].w;
      if (r <= 0) return ORE_TYPES[i];
    }
    return ORE_TYPES[0];
  }

  function spawnOre(k) {
    if (ores.length >= MAX_ORES) return;
    var t = pickType();
    var el = document.createElement('div');
    el.className = 'ore ' + t.cls;
    el.textContent = t.icon;
    var x0 = -26 * k;
    el.style.transform = 'translate3d(' + x0 + 'px,0,0)';
    oresEl.appendChild(el);
    ores.push({ el: el, x: x0, value: oreValue(t.mult) });
  }

  function dropPulse() {
    dropperEl.classList.remove('drop');
    void dropperEl.offsetWidth;
    dropperEl.classList.add('drop');
  }

  function updateOres(dt) {
    var speed = (oreW + 26) / travelTime();
    for (var i = ores.length - 1; i >= 0; i--) {
      var o = ores[i];
      o.x += speed * dt;
      if (o.x >= oreW) {
        ores.splice(i, 1);
        deliver(o);
        continue;
      }
      o.el.style.transform = 'translate3d(' + o.x.toFixed(1) + 'px,0,0)';
    }
  }

  function deliver(o) {
    var el = o.el;
    el.style.transition = 'transform .18s ease-in, opacity .18s ease-in';
    el.style.opacity = '0';
    el.style.transform = 'translate3d(' + (oreW + 10) + 'px,0,0) scale(.55)';
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 210);

    state.pending += o.value;
    state.earned += o.value;
    recent.push({ t: performance.now(), v: o.value });

    binEl.classList.add('hot');
    clearTimeout(binEl._t);
    binEl._t = setTimeout(function () { binEl.classList.remove('hot'); }, 220);
  }

  function collect(auto) {
    var amt = Math.floor(state.pending);
    if (amt < 1) return;
    state.pending = Math.max(0, state.pending - amt);
    state.cash += amt;
    binAmtEl.textContent = money(state.pending);
    collectAmtEl.textContent = money(state.pending);

    cashBlk.classList.add('bump');
    setTimeout(function () { cashBlk.classList.remove('bump'); }, 180);

    if (!auto) Sound.coin();
    coinBurst(binEl, cashEl, auto ? 3 : 8);
    if (!auto) toast('+' + money(amt) + ' 수거 완료!');
  }

  function coinBurst(fromEl, toEl, n) {
    var a = fromEl.getBoundingClientRect();
    var b = toEl.getBoundingClientRect();
    var ax = a.left + a.width / 2, ay = a.top + a.height / 2;
    var bx = b.left + b.width / 2, by = b.top + b.height / 2;
    for (var i = 0; i < n; i++) {
      var el = document.createElement('i');
      el.className = 'coin';
      el.style.left = ax + 'px';
      el.style.top = ay + 'px';
      document.body.appendChild(el);
      var jx = (Math.random() - 0.5) * 90, jy = -40 - Math.random() * 60;
      (function (node) {
        var anim = node.animate([
          { transform: 'translate(-50%,-50%) scale(.5)', opacity: 1 },
          { transform: 'translate(calc(-50% + ' + jx + 'px),calc(-50% + ' + jy + 'px)) scale(1)', opacity: 1, offset: 0.45 },
          { transform: 'translate(calc(-50% + ' + (bx - ax) + 'px),calc(-50% + ' + (by - ay) + 'px)) scale(.3)', opacity: 0 }
        ], { duration: 620 + Math.random() * 260, delay: i * 28, easing: 'cubic-bezier(.3,.1,.35,1)', fill: 'forwards' });
        anim.onfinish = function () { if (node.parentNode) node.parentNode.removeChild(node); };
      })(el);
    }
  }

  /* =========================================================
     HUD 갱신
     ========================================================= */
  var shownCash = state.cash;
  var hudAcc = 0;

  function updateHud(dt) {
    shownCash += (state.cash - shownCash) * Math.min(1, dt * 9);
    if (Math.abs(state.cash - shownCash) < 0.7) shownCash = state.cash;
    cashEl.textContent = money(shownCash);

    hudAcc += dt;
    if (hudAcc >= 0.12) {
      hudAcc = 0;
      var now = performance.now();
      recent = recent.filter(function (r) { return now - r.t < 4000; });
      var sum = 0;
      for (var i = 0; i < recent.length; i++) sum += recent[i].v;
      rateEl.textContent = money(sum / 4);

      binAmtEl.textContent = money(state.pending);
      collectAmtEl.textContent = money(state.pending);
      collectBtn.disabled = state.pending < 1 && !state.passAuto;
      launchValEl.textContent = state.launches;

      if (state.passAuto) {
        collectLabel.textContent = '자동 수거 중';
        collectBtn.classList.add('auto');
      } else {
        collectLabel.textContent = '수거하기';
        collectBtn.classList.remove('auto');
      }
      updateAfford();
    }
  }

  /* =========================================================
     게임 루프
     ========================================================= */
  var lastT = 0;

  function loop(t) {
    if (!lastT) lastT = t;
    var dt = Math.min(0.05, (t - lastT) / 1000);
    lastT = t;

    if (!paused) {
      spawnAcc += dt;
      var si = spawnInterval();
      while (spawnAcc >= si) {
        spawnAcc -= si;
        var n = lineCount();
        for (var k = 0; k < n; k++) spawnOre(k);
        dropPulse();
      }
      updateOres(dt);

      if (state.passAuto) {
        autoAcc += dt;
        if (autoAcc >= AUTO_SECONDS) {
          autoAcc = 0;
          collect(true);
        }
      }
    }

    updateHud(dt);
    requestAnimationFrame(loop);
  }

  /* =========================================================
     패스 토글
     ========================================================= */
  function renderPasses() {
    passX2El.classList.toggle('on', state.passX2);
    passAutoEl.classList.toggle('on', state.passAuto);
    passX2El.querySelector('.pstate').textContent = state.passX2 ? 'ON' : 'OFF';
    passAutoEl.querySelector('.pstate').textContent = state.passAuto ? 'ON' : 'OFF';
  }

  passX2El.addEventListener('click', function () {
    Sound.unlock();
    state.passX2 = !state.passX2;
    renderPasses();
    Sound.build();
    toast(state.passX2 ? '2배 수익 패스 ON — 모든 수익이 2배!' : '2배 수익 패스 OFF');
    saveState();
  });

  passAutoEl.addEventListener('click', function () {
    Sound.unlock();
    state.passAuto = !state.passAuto;
    renderPasses();
    Sound.build();
    toast(state.passAuto ? '자동 수거 패스 ON — 2초마다 자동 정산' : '자동 수거 패스 OFF');
    saveState();
  });

  /* =========================================================
     상점 카드
     ========================================================= */
  var activeTab = 'parts';
  var cardMap = {};

  function cardIdOf(el) { return el.getAttribute('data-id'); }

  function renderShop() {
    listEl.innerHTML = '';
    cardMap = {};
    var i, html, btn, data;

    if (activeTab === 'parts') {
      var built = builtCount();
      for (i = 0; i < PARTS.length; i++) {
        var p = PARTS[i];
        var owned = !!state.parts[p.id];
        var isNext = (!owned && i === built);
        data = { kind: 'part', id: p.id, item: p, price: p.price, locked: (!owned && !isNext) };
        btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'card' + (owned ? ' done' : (data.locked ? ' locked' : ''));
        btn.setAttribute('data-id', p.id);
        var right;
        if (owned) right = '<span class="done">✓ 완료</span>';
        else if (data.locked) right = '<span class="lock">🔒</span>';
        else right = '<span class="price">' + money(p.price) + '</span><span class="lk">구매</span>';
        btn.innerHTML =
          '<div class="cicon">' + p.icon + '</div>' +
          '<div class="cmain"><div class="cname">' + p.name + '</div>' +
          '<div class="cdesc">' + (owned ? '조립 완료' : p.desc) + '</div></div>' +
          '<div class="cbuy">' + right + '</div>';
        btn._data = data;
        listEl.appendChild(btn);
        cardMap[p.id] = btn;
        btn.addEventListener('click', onCardClick);
      }
    } else {
      for (i = 0; i < UPGRADES.length; i++) {
        var u = UPGRADES[i];
        var lv = upLevel(u.id);
        var next = u.levels[lv] || null;
        data = { kind: 'up', id: u.id, item: u, price: next ? next.price : 0, max: !next };
        btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'card' + (next ? '' : ' done');
        btn.setAttribute('data-id', u.id);
        var right2 = next
          ? '<span class="price">' + money(next.price) + '</span><span class="lk">구매</span>'
          : '<span class="done">MAX</span>';
        btn.innerHTML =
          '<div class="cicon">' + u.icon + '</div>' +
          '<div class="cmain"><div class="cname">' + u.name +
          '<span class="lv">Lv.' + lv + '/' + u.levels.length + '</span></div>' +
          '<div class="cdesc">' + u.desc + (next ? ' · ' + next.label : ' · 최대') + '</div></div>' +
          '<div class="cbuy">' + right2 + '</div>';
        btn._data = data;
        listEl.appendChild(btn);
        cardMap[u.id] = btn;
        btn.addEventListener('click', onCardClick);
      }
    }
    updateAfford();
  }

  function updateAfford() {
    var id, el, d;
    for (id in cardMap) {
      if (!Object.prototype.hasOwnProperty.call(cardMap, id)) continue;
      el = cardMap[id];
      d = el._data;
      if (!d) continue;
      if (d.kind === 'part' && (state.parts[d.id] || d.locked)) { el.classList.remove('poor'); continue; }
      if (d.max) { el.classList.remove('poor'); continue; }
      el.classList.toggle('poor', state.cash < d.price);
    }
  }

  function onCardClick(ev) {
    var d = ev.currentTarget._data;
    if (!d) return;
    Sound.unlock();
    if (d.kind === 'part') buyPart(d.item);
    else buyUpgrade(d.item);
  }

  function buyPart(p) {
    if (state.parts[p.id]) return;
    var idx = ORDER.indexOf(p.id);
    var built = builtCount();
    if (idx > built) {
      Sound.fail();
      toast('이전 부품을 먼저 조립해야 합니다');
      return;
    }
    if (state.cash < p.price) {
      Sound.fail();
      toast('캐시가 ' + money(p.price - state.cash) + ' 부족합니다');
      return;
    }
    state.cash -= p.price;
    state.parts[p.id] = true;
    revealPart(p.id);
    Sound.build();
    toast(p.icon + ' ' + p.name + ' 조립 완료!');
    refreshAll();
  }

  function revealPart(id) {
    var g = document.getElementById(SVG_ID[id]);
    if (!g) return;
    g.classList.add('on', 'pop');
    setTimeout(function () { g.classList.remove('pop'); }, 520);
  }

  function buyUpgrade(u) {
    var lv = upLevel(u.id);
    var lvl = u.levels[lv];
    if (!lvl) { toast('이미 최대 레벨입니다'); return; }
    if (state.cash < lvl.price) {
      Sound.fail();
      toast('캐시가 ' + money(lvl.price - state.cash) + ' 부족합니다');
      return;
    }
    state.cash -= lvl.price;
    state.ups[u.id] = lv + 1;
    Sound.build();
    toast(u.icon + ' ' + u.name + ' Lv.' + (lv + 1) + ' (' + lvl.label + ')');
    if (u.id === 'speed') applyBeltSpeed();
    refreshAll();
  }

  function applyBeltSpeed() {
    var dur = travelTime() / 2.2;
    beltEl.style.setProperty('--bdur', dur.toFixed(2) + 's');
  }

  /* =========================================================
     발사 버튼 / 진행 표시
     ========================================================= */
  var phase = 'build';   // build | ready | countdown | flying | reload

  function updateLaunchButton() {
    var built = builtCount();
    partCountEl.textContent = built + '/' + PARTS.length;

    var pips = pipsEl.querySelectorAll('i');
    for (var i = 0; i < pips.length; i++) {
      pips[i].classList.toggle('on', !!state.parts[pips[i].getAttribute('data-p')]);
    }
    if (ghostEl) ghostEl.setAttribute('opacity', (0.2 * (1 - built / PARTS.length)).toFixed(3));

    if (phase === 'build') {
      if (built >= PARTS.length) { phase = 'ready'; }
    }

    if (phase === 'build') {
      var nx = PARTS[Math.min(built, PARTS.length - 1)];
      launchBtn.disabled = true;
      launchBtn.classList.remove('ready');
      launchLabel.textContent = '다음 부품: ' + nx.icon + ' ' + nx.name + ' ' + money(nx.price);
    } else if (phase === 'ready') {
      launchBtn.disabled = false;
      launchBtn.classList.add('ready');
      launchLabel.textContent = '🚀 로켓 발사!';
    } else {
      launchBtn.disabled = true;
      launchBtn.classList.remove('ready');
    }
  }

  function refreshAll() {
    updateLaunchButton();
    renderShop();
    renderPasses();
    saveState();
  }

  /* =========================================================
     발사 시퀀스
     ========================================================= */
  function showCd(text) {
    cdEl.textContent = text;
    cdEl.classList.remove('pop');
    void cdEl.offsetWidth;
    cdEl.classList.add('pop');
  }

  function nozzlePos() {
    var r = rocketSvg.getBoundingClientRect();
    var s = stageEl.getBoundingClientRect();
    return { x: r.left - s.left + r.width * 0.5, y: r.top - s.top + r.height * 0.86 };
  }

  function spark(x, y, kind) {
    var el = document.createElement('i');
    el.className = 'pt';
    var size, life, dx, dy, color, grow;
    if (kind === 'flame') {
      size = rand(7, 15); life = rand(380, 620);
      dx = rand(-14, 14); dy = rand(34, 90);
      color = 'hsl(' + Math.round(rand(18, 48)) + ',100%,' + Math.round(rand(55, 72)) + '%)';
      grow = 0.25;
    } else {
      size = rand(14, 26); life = rand(700, 1100);
      dx = rand(-34, 34); dy = rand(18, 60);
      color = 'rgba(200,212,235,.22)';
      grow = 2.1;
    }
    el.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:' + size + 'px;height:' + size + 'px;background:' + color + ';';
    fxEl.appendChild(el);
    var anim = el.animate([
      { transform: 'translate(-50%,-50%) scale(1)', opacity: kind === 'flame' ? 0.95 : 0.5 },
      { transform: 'translate(calc(-50% + ' + dx + 'px),calc(-50% + ' + dy + 'px)) scale(' + grow + ')', opacity: 0 }
    ], { duration: life, easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'forwards' });
    anim.onfinish = function () { if (el.parentNode) el.parentNode.removeChild(el); };
  }

  var emitting = false, lastEmit = 0, flightStart = 0;

  function padPos() {
    var r = padSvg.getBoundingClientRect();
    var s = stageEl.getBoundingClientRect();
    return { x: r.left - s.left + r.width * 0.5, y: r.top - s.top + r.height * 0.97 };
  }

  function emitLoop() {
    if (!emitting) return;
    var t = performance.now();
    if (t - lastEmit > 28) {
      lastEmit = t;
      var p = nozzlePos();
      spark(p.x + rand(-9, 9), p.y, 'flame');
      spark(p.x + rand(-13, 13), p.y, 'flame');
      if (Math.random() < 0.6) spark(p.x + rand(-30, 30), p.y + 4, 'smoke');
      if (t - flightStart < 1500) {
        var g = padPos();
        spark(g.x + rand(-52, 52), g.y, 'smoke');
      }
    }
    requestAnimationFrame(emitLoop);
  }
  function startEmit() { if (emitting) return; emitting = true; flightStart = performance.now(); emitLoop(); }
  function stopEmit() { emitting = false; }

  function showReward(amount) {
    var el = document.createElement('div');
    el.className = 'reward';
    el.textContent = '발사 성공! +' + money(amount);
    el.style.left = '50%';
    el.style.top = '30%';
    stageEl.appendChild(el);
    var anim = el.animate([
      { opacity: 0, transform: 'translate(-50%,-50%) scale(.6)' },
      { opacity: 1, transform: 'translate(-50%,-50%) scale(1.08)', offset: 0.25 },
      { opacity: 1, transform: 'translate(-50%,-90%) scale(1)', offset: 0.7 },
      { opacity: 0, transform: 'translate(-50%,-140%) scale(.95)' }
    ], { duration: 2000, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'forwards' });
    anim.onfinish = function () { if (el.parentNode) el.parentNode.removeChild(el); };
  }

  function resetRocket() {
    flyEl.style.transition = 'none';
    flyEl.style.transform = 'translateY(0) scale(1)';
    flyEl.style.opacity = '1';
    void flyEl.offsetWidth;
    flyEl.classList.remove('lit');
  }

  async function doLaunch() {
    if (phase !== 'ready') return;
    Sound.unlock();

    phase = 'countdown';
    launchBtn.disabled = true;
    launchBtn.classList.remove('ready');

    for (var i = 3; i >= 1; i--) {
      launchLabel.textContent = '발사 준비… ' + i;
      showCd(String(i));
      Sound.beep();
      await sleep(1000);
    }

    showCd('GO!');
    Sound.go();
    phase = 'flying';
    launchLabel.textContent = '🚀 발사 중…';

    // 점화
    flyEl.classList.add('lit');
    stageEl.classList.add('shake');
    setTimeout(function () { stageEl.classList.remove('shake'); }, 460);
    flashEl.classList.remove('on');
    void flashEl.offsetWidth;
    flashEl.classList.add('on');
    Sound.rumble();
    startEmit();
    await sleep(460);

    // 상승 (작아지며 우주로)
    var dist = stageEl.clientHeight * 0.82;
    flyEl.style.transition = 'transform 2.4s cubic-bezier(.38,.08,.68,1), opacity 1.2s ease-in 1.2s';
    flyEl.style.transform = 'translateY(-' + dist.toFixed(0) + 'px) scale(.4)';
    flyEl.style.opacity = '0';
    await sleep(2400);
    stopEmit();

    // 보상
    var reward = launchReward();
    state.cash += reward;
    state.earned += reward;
    state.launches += 1;
    launchValEl.textContent = state.launches;
    showReward(reward);
    coinBurst(stageEl, cashEl, 10);
    Sound.win();
    launchLabel.textContent = '발사 성공! +' + money(reward);
    saveState();

    await sleep(700);
    phase = 'reload';
    launchLabel.textContent = '다음 로켓 재조립 중…';
    resetRocket();

    await sleep(900);
    phase = 'ready';
    launchBtn.disabled = false;
    launchBtn.classList.add('ready');
    launchLabel.textContent = '🚀 로켓 발사!';
    flyEl.classList.remove('lit');
    saveState();
  }

  launchBtn.addEventListener('click', function () {
    if (phase === 'ready') doLaunch();
  });

  /* =========================================================
     토스트
     ========================================================= */
  var toastTimer = null;
  function toast(msg) {
    if (phase === 'countdown' || phase === 'flying') return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1700);
  }

  /* =========================================================
     탭
     ========================================================= */
  var tabs = document.querySelectorAll('.tab');
  for (var ti = 0; ti < tabs.length; ti++) {
    (function (tab) {
      tab.addEventListener('click', function () {
        for (var j = 0; j < tabs.length; j++) tabs[j].classList.remove('on');
        tab.classList.add('on');
        activeTab = tab.getAttribute('data-tab');
        renderShop();
      });
    })(tabs[ti]);
  }

  /* =========================================================
     수거 버튼
     ========================================================= */
  collectBtn.addEventListener('click', function () {
    Sound.unlock();
    collect(false);
  });

  /* =========================================================
     사운드 / 초기화
     ========================================================= */
  function renderSound() {
    soundBtn.textContent = Sound.isMuted() ? '🔇' : '🔊';
  }
  soundBtn.addEventListener('click', function () {
    var next = !Sound.isMuted();
    Sound.setMuted(next);
    state.sound = !next;
    renderSound();
    if (!next) Sound.unlock();
    saveState();
  });

  resetBtn.addEventListener('click', function () {
    if (window.confirm('모든 진행 상황(캐시·부품·업그레이드)을 초기화할까요?')) {
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
      location.reload();
    }
  });

  /* =========================================================
     시작
     ========================================================= */
  function boot() {
    measure();
    applyBeltSpeed();
    renderPasses();
    renderSound();
    renderShop();
    updateLaunchButton();
    cashEl.textContent = money(state.cash);
    binAmtEl.textContent = money(state.pending);
    collectAmtEl.textContent = money(state.pending);
    for (var i = 0; i < ORDER.length; i++) {
      if (state.parts[ORDER[i]]) {
        var g = document.getElementById(SVG_ID[ORDER[i]]);
        if (g) g.classList.add('on');
      }
    }
    if (builtCount() >= PARTS.length && phase === 'build') {
      phase = 'ready';
      updateLaunchButton();
    }

    if (hadSave) toast('이어서 플레이합니다 · 발사 ' + state.launches + '회');
    else setTimeout(function () { toast('⛏️ 광석을 수거해 부품을 조립하세요!'); }, 500);

    if (!state.seen) {
      state.seen = true;
      setTimeout(function () { toast('패스 버튼을 눌러 2배 수익·자동 수거를 체험해 보세요'); }, 3400);
      saveState();
    }

    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', function () {
    measure();
    applyBeltSpeed();
  });

  window.addEventListener('orientationchange', function () {
    setTimeout(measure, 250);
  });

  document.addEventListener('visibilitychange', function () {
    paused = document.hidden;
    if (document.hidden) saveState();
    lastT = 0;
  });

  window.addEventListener('pagehide', saveState);
  window.addEventListener('beforeunload', saveState);
  setInterval(saveState, 4000);

  // 핀치 확대 방지 (더블탭 확대는 CSS touch-action: manipulation 이 막는다)
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('gesturechange', function (e) { e.preventDefault(); });

  // 디버그용
  window.__rt = { state: function () { return state; }, phase: function () { return phase; } };

  boot();
})();
</script>
</body>
</html>
