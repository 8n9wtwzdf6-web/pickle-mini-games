/* ============================================================
   시작 / 리셋
   ============================================================ */
function buildAll(){
  S.turrets.length = 0; S.enemies.length = 0; S.projs.length = 0;
  S.fx.length = 0; S.rings.length = 0; S.lines.length = 0; timers.length = 0;
  turretProtoCache = {};
  world.clear();
  centerGroup.clear();
  centerRings.length = 0; tetherLines.length = 0; bossBeams.length = 0; BOLTS.length = 0; ISLANDS.length = 0;
  tileMeshes.length = 0; aiSwarm.length = 0; gateMarkers.length = 0; pathLines.length = 0;
  bossGroup = null; bossVisible = false; bossParts = { spin:[] };
  playerIsland = null; playerBase = null; playerCore = null;
  coreRings.length = 0; coreOrb = null; coreGlow = null;
  world.add(centerGroup);

  buildFlowField();
  buildPlayerIsland();
  drawPaths();
  buildCenter();
  buildBoss();
  buildTeams();
  ISLANDS.push({ group:playerIsland, team:{ icon:RACES[P.race].icon, name:'내 섬', stage:1, progress:0, hp:100 } });
  const races = ['human','drone','mecha','arcane','bio'].filter(function(r){ return r !== P.race; });
  for(let i=0;i<4;i++){
    const a = islandAngle(i+1);
    const pos = new THREE.Vector3(Math.sin(a)*RING_R, 0, Math.cos(a)*RING_R);
    const g = buildAIIsland(i, races[i], pos);
    ISLANDS.push({ group:g, team:S.aiTeams[i] });
  }
  makeTags();
  renderTeamStrip();
}
function resetRun(){
  S.phase = 'play'; S.paused = false; S.speed = 1; S.time = 0;
  S.stage = 1; S.stageClock = 0; S.mobsLeft = STAGE_MOBS; S.spawnQ = []; S.spawnT = 0;
  S.stageClearing = false; S.nextT = 0;
  S.coreMax = 120 + upgCore(); S.core = S.coreMax;
  S.min = 160 + startBonus(); S.gas = 30; S.gems = 0;
  S.kills = 0; S.dmg = 0; S.leaks = 0;
  S.mode = 0; S.skillT = 0; S.modeCd = 0; S.boost = 0; S.buffSpd = 0;
  S.boss = null; S.revive = null; S.revivesUsed = 0; S.shield = false;
  S.sel = null; S.result = null; S.merges = 0;
  S.spawnQ = [];
}
function startRun(){
  document.body.classList.remove('introOpen');
  $('intro').classList.add('hide');
  closeModal();
  buildAll();
  resetRun();
  startStage(1);
  fitCamera('islands');
  refreshHud();
  setTimeoutLocal(1.2, function(){
    banner('🔭 5개 부유섬 전장', '내 섬을 탭하면 🎯 집중 건설 모드', 2600);
  });
}
function restartRun(){
  buildAll();
  resetRun();
  startStage(1);
  fitCamera('islands');
  refreshHud();
}

/* ============================================================
   이벤트 연결
   ============================================================ */
let ptrDown = null, ptrMoved = false;
function bindUI(){
  const cv = $('c');
  cv.addEventListener('pointerdown', function(e){
    ptrDown = { x:e.clientX, y:e.clientY, t:performance.now() };
    ptrMoved = false;
  });
  cv.addEventListener('pointermove', function(e){
    if(!ptrDown) return;
    if(Math.abs(e.clientX-ptrDown.x) + Math.abs(e.clientY-ptrDown.y) > 14) ptrMoved = true;
  });
  cv.addEventListener('pointerup', function(e){
    if(!ptrDown) return;
    const dt = performance.now() - ptrDown.t;
    const wasMove = ptrMoved;
    ptrDown = null;
    if(wasMove || dt > 700) return;
    tapWorld(e.clientX, e.clientY);
  });
  cv.addEventListener('pointercancel', function(){ ptrDown = null; });

  $('btnStart').onclick = startRun;
  $('btnView').onclick = function(){
    fitCamera(CAM.mode === 'islands' ? 'focus' : 'islands');
    refreshHud();
  };
  $('btnMode').onclick = function(){ switchMode(); };
  $('btnSkill').onclick = function(){ useSkill(); };
  $('btnDraw').onclick = function(){ autoDraw(); };
  $('btnSpeed').onclick = function(){
    S.speed = S.speed >= 3 ? 1 : S.speed + 1;
    refreshHud();
  };
  $('teamStrip').onclick = openRanking;
  $('btnShop').onclick = function(){ shopTab('item'); };
  $('btnBene').onclick = function(){ benefitTab('daily'); };
  $('btnRec').onclick = openRecipes;
  $('btnHelp').onclick = openHelp;
  $('btnSound').onclick = function(){
    SOUND.on = !SOUND.on;
    $('btnSound').textContent = SOUND.on ? '🔊' : '🔇';
  };
  $('sheetX').onclick = closeSheet;
  $('modal').addEventListener('click', function(e){ if(e.target === $('modal')) closeModal(); });

  window.addEventListener('resize', function(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    fitCamera(CAM.mode, true);
  });
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
}

/* 자동 소환 — 게이트에 가장 가까운 빈 타일 */
function autoDraw(){
  if(S.phase !== 'play' && S.phase !== 'boss'){ toast('전투 중에 사용할 수 있습니다'); return; }
  if(S.min < GACHA_COST){ toast('💎 미네랄이 부족합니다'); return; }
  let best = null, bd = 1e9;
  for(let i=0;i<tileMeshes.length;i++){
    const t = tileMeshes[i];
    if(cellOccupied(t.col,t.row)) continue;
    const d = Math.hypot(t.x, t.z);
    if(d < bd){ bd = d; best = t; }
  }
  if(!best){ toast('빈 타일이 없습니다'); return; }
  S.min -= GACHA_COST;
  const tier = rollTier();
  placeTurret(best.col, best.row, tier, Math.random()<0.5?0:1, P.race);
  toast('🎲 ' + TIERS[tier].name + ' 터렛 자동 배치');
  refreshHud();
}

/* ============================================================
   사운드 (가벼운 WebAudio)
   ============================================================ */
const SOUND = { on:true, ctx:null };
function beep(freq, dur, type, vol){
  if(!SOUND.on) return;
  try{
    if(!SOUND.ctx) SOUND.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = SOUND.ctx;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.value = vol || 0.03;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    o.stop(ctx.currentTime + dur);
  }catch(e){}
}

/* ============================================================
   부팅
   ============================================================ */
function updateStay(dt){
  P.stay = (P.stay||0) + dt;
  if(!P._staySaved || S.time - P._staySaved > 20){ P._staySaved = S.time; saveProfile(); }
}
function boot(){
  ensureDay();
  buildAll();
  fitCamera('islands', true);
  renderIntro();
  bindUI();
  refreshHud();
  requestAnimationFrame(tick);
  // 주기 저장
  setInterval(function(){ saveProfile(); }, 15000);
}

/* 테스트/디버그 훅 */
window.__V3 = {
  S:S, P:P,
  stage:function(n){ S.phase='play'; buildAll(); resetRun(); startStage(n); fitCamera('islands'); refreshHud(); return S.stage; },
  boss:function(){ S.phase='play'; buildAll(); resetRun(); startStage(WAVE_MAX); S.stage = WAVE_MAX; clearStage(); S.stageClearing = false; startBossPhase(); return !!S.boss; },
  cam:function(m, instant){ fitCamera(m, instant!==false); refreshHud(); return CAM.mode; },
  place:function(col,row,tier,kind,race){ return !!placeTurret(col,row,tier||0,kind||0,race||P.race); },
  autoPlace:function(){ autoDraw(); return S.turrets.length; },
  mode:function(){ switchMode(); return S.mode; },
  skill:function(){ S.skillT = 0; useSkill(); return true; },
  core:function(v){ S.core = v; if(v<=0) startRevive(); return S.core; },
  hurtBoss:function(n){ if(S.boss) S.boss.hp -= (n||100000); return S.boss?Math.round(S.boss.hp):null; },
  select:function(col,row){ const t=cellOccupied(col,row); if(t) selectTurret(t); return !!t; },
  sheet:function(){ return document.getElementById('sheet').className; },
  modal:function(){ return document.getElementById('modal').className; },
  forceAllTurrets:function(n){
    const cells = [];
    for(let r=0;r<6;r++) for(let c=0;c<6;c++) if(!isCoreCell(c,r)) cells.push([c,r]);
    for(let i=0;i<Math.min(n,cells.length);i++) placeTurret(cells[i][0], cells[i][1], 3, i%2, P.race);
    return S.turrets.length;
  },
  addEnemies:function(n, hero){
    for(let i=0;i<n;i++) spawnEnemy(!!hero && i===0);
    return S.enemies.length;
  },
  info:function(){
    return { phase:S.phase, stage:S.stage, turrets:S.turrets.length, enemies:S.enemies.length,
      core:S.core, min:Math.round(S.min), bossHp:S.boss?Math.round(S.boss.hp):null,
      view:CAM.mode, mode:S.mode, race:P.race, tiles:tileMeshes.length };
  }
};

if(document.readyState === 'complete' || document.readyState === 'interactive') boot();
else window.addEventListener('DOMContentLoaded', boot);
