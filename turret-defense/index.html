<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#03060d">
<title>🌌 우주 5섬 · 자유 전략 그리드 터렛 디펜스</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#03060d;
  font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color:#eaf6ff;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
#c{position:fixed;inset:0;display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;display:flex;flex-direction:column;pointer-events:none;z-index:5;
  padding:calc(6px + env(safe-area-inset-top)) 7px calc(6px + env(safe-area-inset-bottom)) 7px}
#hud button,.pressable{pointer-events:auto}
.topRow{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.chips{display:flex;flex-wrap:nowrap;gap:4px;align-items:center}
.chip{display:flex;align-items:center;gap:4px;height:27px;padding:0 9px;border-radius:9px;
  background:linear-gradient(180deg,rgba(16,32,48,.86),rgba(6,13,22,.9));
  border:1px solid rgba(90,180,230,.28);box-shadow:0 2px 10px rgba(0,0,0,.45),inset 0 1px 0 rgba(160,230,255,.12);
  font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;color:#dff2ff}
.chip#raceChip{border-color:rgba(120,210,255,.55);color:#bff0ff;text-shadow:0 0 10px rgba(90,220,255,.5)}
.chip#stageChip{background:linear-gradient(180deg,rgba(38,26,8,.9),rgba(18,11,2,.92));border-color:rgba(255,201,77,.45);color:#ffe9a8}
.chip#mobChip{border-color:rgba(255,110,150,.4);color:#ffd0dc}
.iconRow{display:flex;gap:5px;pointer-events:auto}
.icobtn{width:31px;height:31px;border-radius:10px;border:1px solid rgba(110,190,230,.32);
  background:linear-gradient(180deg,rgba(18,34,50,.92),rgba(6,12,20,.94));color:#cfeeff;font-size:15px;
  display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 2px 9px rgba(0,0,0,.45);
  position:relative;overflow:hidden}
.icobtn:active{transform:scale(.94)}
.icobtn .dot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:#ff5f6d;box-shadow:0 0 8px #ff5f6d}

/* ── 5팀 순위표 ── */
.teamStrip{pointer-events:auto;display:flex;gap:4px;margin-top:6px;padding:4px;border-radius:11px;
  background:linear-gradient(180deg,rgba(8,18,28,.72),rgba(3,8,14,.8));
  border:1px solid rgba(80,160,210,.22);backdrop-filter:blur(6px)}
.team{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding:3px 4px;border-radius:8px;
  border:1px solid transparent;background:rgba(255,255,255,.02);position:relative;overflow:hidden}
.team.me{border-color:rgba(120,230,255,.55);background:linear-gradient(180deg,rgba(20,60,80,.55),rgba(8,24,36,.6));box-shadow:0 0 12px rgba(80,220,255,.18) inset}
.team .t1{display:flex;align-items:center;gap:3px;font-size:10px;font-weight:800;color:#cfe6f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .t1 i{font-style:normal;font-size:11px}
.team .t2{display:flex;justify-content:space-between;font-size:9px;color:#8fb6cc;letter-spacing:.01em}
.team .t2 b{color:#fff0b8;font-weight:800}
.team .beat{position:absolute;left:0;bottom:0;height:2px;background:linear-gradient(90deg,#54e8ff,#b07bff);width:0%}

.resRow{display:flex;gap:5px;justify-content:center;margin-bottom:5px;flex-wrap:wrap}
.res{display:flex;align-items:center;gap:3px;height:23px;padding:0 8px;border-radius:8px;font-size:11px;font-weight:800;
  background:rgba(6,14,22,.82);border:1px solid rgba(90,170,220,.22);color:#dceefb}
.res b{font-weight:800}
.res.min b{color:#9fe0ff}.res.gas b{color:#a8ffcf}.res.gem b{color:#e8b8ff}.res.kill b{color:#ffd9a0}
.coreWrap{margin:0 auto 6px;width:min(340px,86%);pointer-events:none}
.coreLabel{display:flex;justify-content:space-between;font-size:10px;color:#9fc4d8;margin-bottom:2px;letter-spacing:.03em}
.coreLabel b{color:#dff6ff}
.coreBar{height:8px;border-radius:6px;background:rgba(4,10,16,.9);border:1px solid rgba(90,170,220,.28);overflow:hidden;position:relative}
.coreBar i{display:block;height:100%;width:100%;border-radius:6px;background:linear-gradient(90deg,#2bd4ff,#57ffc0);transition:width .18s;box-shadow:0 0 12px rgba(70,230,255,.5)}
.coreBar i.low{background:linear-gradient(90deg,#ff4d6a,#ff9a3a)}
.actRow{display:flex;gap:5px;justify-content:center}
.act{flex:1;max-width:88px;height:50px;border-radius:13px;border:1px solid rgba(100,180,225,.3);
  background:linear-gradient(180deg,rgba(20,40,58,.94),rgba(7,14,24,.96));
  color:#d8efff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;
  box-shadow:0 3px 12px rgba(0,0,0,.5),inset 0 1px 0 rgba(160,230,255,.14)}
.act b{font-size:17px;line-height:1;font-weight:700}
.act span{font-size:8.5px;letter-spacing:.02em;color:#9fc4d8;font-weight:700;white-space:nowrap}
.act:active{transform:scale(.95)}
.act.on{border-color:rgba(120,235,255,.85);box-shadow:0 0 16px rgba(80,220,255,.35),inset 0 0 14px rgba(60,200,255,.18)}
.act.gold{border-color:rgba(255,201,77,.6);background:linear-gradient(180deg,rgba(60,44,10,.95),rgba(20,14,3,.96));color:#ffe6a8}
.act.ready{border-color:#7dffc0;box-shadow:0 0 16px rgba(90,255,180,.35)}
.act .cdmask{position:absolute;inset:0;background:rgba(4,8,14,.72);border-radius:12px;pointer-events:none}
.act{position:relative;overflow:hidden}

/* ── 하단 시트 (타일 건설) ── */
.sheet{max-height:62vh;display:flex;flex-direction:column;position:fixed;left:0;right:0;bottom:0;z-index:20;transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.8,.3,1);
  background:#0a1522;background-image:linear-gradient(180deg,rgba(20,44,64,.96),rgba(6,12,20,.99));
  border-top:1px solid rgba(110,205,255,.35);border-radius:20px 20px 0 0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  box-shadow:0 -12px 40px rgba(0,0,0,.65),inset 0 1px 0 rgba(160,230,255,.18)}
.sheet.open{transform:translateY(0)}
.sheet #sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;max-height:calc(62vh - 52px)}
.sheetHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.sheetHead h3{margin:0;font-size:14px;letter-spacing:.01em}
.sheetHead .st{font-size:10px;color:#8fb6cc}
.sheetHead .st b{color:#ffe9a8}
.sheetX{width:26px;height:26px;border-radius:8px;border:1px solid rgba(120,190,230,.3);background:rgba(10,20,30,.9);color:#bfe4ff;font-size:13px;line-height:1;padding:0}
.buildGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.bcard{display:flex;align-items:center;gap:8px;padding:8px 9px;min-width:0;overflow:hidden;border-radius:11px;border:1px solid rgba(100,180,225,.26);
  background:linear-gradient(180deg,rgba(20,38,54,.8),rgba(7,14,24,.9));color:#e6f6ff;text-align:left;font-family:inherit}
.bcard:active{transform:scale(.98)}
.bcard .bi{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;
  background:rgba(90,200,255,.12);border:1px solid rgba(110,210,255,.3);flex:none}
.bcard .btx{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1 1 auto;overflow:hidden}
.bcard .btx b{font-size:11.5px;font-weight:800}
.bcard .btx span{font-size:9.5px;color:#8fb6cc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard .cost{flex:none;margin-left:auto;font-size:10px;font-weight:800;color:#9fe0ff;white-space:nowrap}
.bcard.dis{opacity:.45}
.bcard.wide{grid-column:span 2}
.bcard.fuse{border-color:rgba(255,201,77,.6);background:linear-gradient(180deg,rgba(58,44,12,.85),rgba(20,14,4,.92))}
.brow{display:flex;gap:6px;margin-top:7px}
.brow .bcard{flex:1}
.sell{color:#ff9aa8;border-color:rgba(255,120,140,.4)!important}

/* ── 모달 ── */
.modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:12px;
  background:rgba(2,5,10,.72);backdrop-filter:blur(3px)}
.modal.open{display:flex}
.card{width:min(430px,100%);max-height:88vh;display:flex;flex-direction:column;border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,rgba(14,30,46,.99),rgba(5,10,18,.995));
  border:1px solid rgba(110,200,255,.34);box-shadow:0 20px 70px rgba(0,0,0,.75),inset 0 1px 0 rgba(160,230,255,.16)}
.cbar{display:flex;align-items:center;gap:7px;padding:9px 12px;font-size:10px;letter-spacing:.1em;color:#9fc4d8;
  border-bottom:1px solid rgba(90,170,220,.18);background:rgba(6,14,22,.6);font-weight:800}
.cbar .cl{width:6px;height:6px;border-radius:50%;background:#54e8ff;box-shadow:0 0 8px #54e8ff}
.cbar .cv{margin-left:auto;color:#ffe9a8}
.cbody{padding:12px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.card h1{margin:0 0 4px;font-size:19px;letter-spacing:.01em}
.card .sub{margin:0 0 9px;font-size:11px;color:#8fb6cc;line-height:1.45}
.tabs{display:flex;gap:4px;padding:7px 10px 0}
.tabs button{flex:1;height:27px;border-radius:8px;border:1px solid rgba(100,180,225,.24);background:rgba(10,20,30,.8);
  color:#a9c8db;font-size:10.5px;font-weight:800;font-family:inherit;padding:0}
.tabs button.on{background:linear-gradient(180deg,rgba(30,80,110,.9),rgba(10,30,44,.9));color:#d9f6ff;border-color:rgba(120,230,255,.7);
  box-shadow:0 0 12px rgba(80,220,255,.25)}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:9px;padding:9px;border-radius:11px;border:1px solid rgba(100,180,225,.2);
  background:linear-gradient(180deg,rgba(18,34,50,.7),rgba(7,14,24,.85))}
.item .ii{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;
  background:rgba(90,200,255,.1);border:1px solid rgba(110,210,255,.26);flex:none}
.item .tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.item .tx b{font-size:11.5px}
.item .tx span{font-size:9.5px;color:#8fb6cc;line-height:1.35}
.buy{flex:none;min-width:62px;height:28px;border-radius:8px;border:1px solid rgba(255,201,77,.55);
  background:linear-gradient(180deg,rgba(70,52,12,.95),rgba(26,18,3,.95));color:#ffe9a8;font-size:10.5px;font-weight:800;
  font-family:inherit;padding:0 8px}
.buy.gem{border-color:rgba(200,140,255,.55);background:linear-gradient(180deg,rgba(50,26,72,.95),rgba(20,8,32,.95));color:#ecc9ff}
.buy.free{border-color:rgba(120,255,190,.55);background:linear-gradient(180deg,rgba(16,58,40,.95),rgba(6,22,14,.95));color:#b8ffd8}
.buy.dis{opacity:.45}
.foot{padding:8px 12px;border-top:1px solid rgba(90,170,220,.16);font-size:9px;color:#708fa1;line-height:1.4}
.cta{width:100%;height:42px;border-radius:12px;border:1px solid rgba(120,235,255,.6);font-family:inherit;
  background:linear-gradient(180deg,rgba(26,96,130,.95),rgba(8,34,52,.98));color:#e6fbff;font-size:14px;font-weight:800;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;box-shadow:0 4px 18px rgba(0,120,180,.3)}
.cta small{font-size:8.5px;letter-spacing:.14em;color:#8fd8ef;font-weight:700}
.cta.ghost{background:rgba(10,20,30,.8);border-color:rgba(100,180,225,.3);color:#b8d8ea;box-shadow:none;font-size:12.5px;height:36px}
.cta.gold{background:linear-gradient(180deg,rgba(120,86,16,.96),rgba(38,26,4,.98));border-color:rgba(255,201,77,.7);color:#fff2c8}
.cta:active{transform:scale(.98)}

/* ── 인트로 ── */
body.introOpen #hud,body.introOpen #tags{opacity:0;pointer-events:none}
body.introOpen #hud *{pointer-events:none}
.intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;
  padding:14px calc(12px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
  background:linear-gradient(180deg,rgba(3,6,13,.05) 0%,rgba(3,6,13,.2) 34%,rgba(3,6,13,.86) 66%,rgba(3,6,13,.97) 100%);
  transition:opacity .3s}
.intro.hide{opacity:0;pointer-events:none}
.introTop{position:absolute;top:calc(14px + env(safe-area-inset-top));left:0;right:0;text-align:center;padding:0 14px}
.introTop .wg{font-size:10px;letter-spacing:.34em;color:#7fdcff;text-shadow:0 0 14px rgba(80,220,255,.7);font-weight:800}
.introTop h1{margin:6px 0 5px;font-size:clamp(21px,6.2vw,32px);line-height:1.16;letter-spacing:-.01em;
  text-shadow:0 0 26px rgba(70,200,255,.4),0 2px 10px rgba(0,0,0,.9)}
.introTop h1 em{font-style:normal;color:#ffe08a;text-shadow:0 0 22px rgba(255,190,60,.55)}
.introTop p{margin:0;font-size:11px;color:#a8c8da;line-height:1.5}
.racePick{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}
.rc{border-radius:10px;border:1px solid rgba(100,180,225,.25);background:rgba(8,18,28,.86);padding:6px 3px;color:#cfe6f5;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
.rc .ri{font-size:18px;line-height:1}
.rc .rn{font-size:9.5px;font-weight:800}
.rc .rt{font-size:7.5px;color:#7fa4b8;text-align:center;line-height:1.2}
.rc.on{border-color:rgba(130,235,255,.9);background:linear-gradient(180deg,rgba(24,70,96,.95),rgba(8,24,36,.95));
  box-shadow:0 0 18px rgba(80,220,255,.28),inset 0 0 14px rgba(60,200,255,.16)}
.rc.on .rn{color:#dffbff}
.introNote{font-size:9.5px;color:#7b9aad;text-align:center;margin:0 0 7px;line-height:1.45}
.startBtn{width:100%;height:52px;border-radius:15px;border:1px solid rgba(255,214,120,.75);font-family:inherit;
  background:linear-gradient(180deg,rgba(255,206,90,.98),rgba(196,132,24,.98));color:#241503;font-size:17px;font-weight:900;
  letter-spacing:.02em;box-shadow:0 10px 34px rgba(255,170,40,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.startBtn small{display:block;font-size:8.5px;letter-spacing:.2em;font-weight:800;opacity:.7}
.startBtn:active{transform:scale(.99)}

/* 배너/토스트 */
#banner{position:fixed;left:50%;top:20%;max-width:88vw;transform:translate(-50%,-50%) scale(.86);z-index:15;pointer-events:none;
  text-align:center;opacity:0;transition:opacity .18s,transform .18s}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner .b1{font-size:21px;white-space:nowrap;font-weight:900;letter-spacing:.01em;text-shadow:0 0 26px rgba(80,220,255,.7),0 3px 14px rgba(0,0,0,.9)}
#banner .b2{font-size:10.5px;white-space:nowrap;color:#bfe4ff;letter-spacing:.16em;margin-top:2px;font-weight:800}
#toast{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);z-index:16;pointer-events:none;
  padding:7px 13px;border-radius:20px;background:rgba(8,20,30,.94);border:1px solid rgba(110,210,255,.4);
  font-size:11px;font-weight:700;color:#dff6ff;opacity:0;transition:opacity .2s;max-width:86%;text-align:center}
#toast.show{opacity:1}
.dmgN{position:fixed;z-index:8;pointer-events:none;font-weight:900;font-size:11px;color:#fff;text-shadow:0 0 6px rgba(0,180,255,.8),0 2px 5px #000;
  will-change:transform,opacity}
.dmgN.crit{font-size:15px;color:#ffe08a;text-shadow:0 0 10px rgba(255,170,30,.9),0 2px 5px #000}

/* 전체 5섬 뷰 라벨 */
.tag{position:fixed;transform:translate(-50%,-100%);z-index:6;pointer-events:none;text-align:center;
  font-size:8.5px;font-weight:800;color:#cfeaff;text-shadow:0 1px 4px #000,0 0 10px rgba(0,0,0,.8);white-space:nowrap;
  padding:2px 6px;border-radius:7px;background:rgba(4,10,18,.55);border:1px solid rgba(110,200,255,.28)}
.tag.me{color:#fff6c8;border-color:rgba(255,210,90,.5)}
.tag .bar{width:52px;height:3px;border-radius:2px;background:rgba(255,255,255,.16);margin:2px auto 0;overflow:hidden}
.tag .bar i{display:block;height:100%;background:linear-gradient(90deg,#54e8ff,#b07bff);width:0%}
.tag .sub{font-size:8px;color:#9dc0d4;font-weight:600;margin-top:1px}

@media (min-width:900px){
  #hud{padding:12px 14px 14px}
  .chip{height:31px;font-size:12.5px;padding:0 12px}
  .icobtn{width:36px;height:36px;font-size:17px}
  .teamStrip{max-width:620px;margin:8px auto 0;gap:6px;padding:6px}
  .team .t1{font-size:11.5px}.team .t2{font-size:10px}
  .act{height:58px;max-width:104px}.act b{font-size:20px}.act span{font-size:9.5px}
  .resRow{margin-bottom:7px}
  .coreWrap{width:min(420px,50%)}
  .intro{justify-content:center;align-items:flex-start}
  .intro .inner{width:min(430px,42%);margin-left:5%}
  .introTop{text-align:left;left:5%;right:auto;max-width:44%}
  .racePick{grid-template-columns:repeat(5,1fr)}
  .startBtn{width:100%}
  .sheet{left:auto;right:14px;bottom:14px;width:min(370px,34%);border-radius:18px;border:1px solid rgba(110,205,255,.35)}
}
</style>
</head>
<body class="introOpen">
<canvas id="c"></canvas>

<div id="hud">
  <div class="topRow">
    <div class="chips">
      <div class="chip" id="raceChip">👤 휴먼</div>
      <div class="chip" id="stageChip">STAGE 1</div>
      <div class="chip" id="mobChip" style="display:none">100 남음</div>
    </div>
    <div class="iconRow">
      <button class="icobtn" id="btnShop" title="상점">🛒</button>
      <button class="icobtn" id="btnBene" title="혜택">🎁</button>
      <button class="icobtn" id="btnRec" title="합체 레시피">🔀</button>
      <button class="icobtn" id="btnHelp" title="도움말">❓</button>
      <button class="icobtn" id="btnSound" title="소리">🔊</button>
    </div>
  </div>
  <div class="teamStrip" id="teamStrip"></div>
  <div id="bossWrap" style="display:none;margin-top:6px;padding:5px 9px;border-radius:11px;background:linear-gradient(180deg,rgba(40,6,16,.86),rgba(14,2,6,.9));border:1px solid rgba(255,90,120,.45);box-shadow:0 0 18px rgba(255,60,90,.18)">
    <div style="display:flex;justify-content:space-between;font-size:9.5px;color:#ffc7d2;letter-spacing:.06em;font-weight:800"><span>☠️ FINAL BOSS</span><span id="bossTxt">-</span></div>
    <div style="height:7px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:3px"><i id="bossFill" style="display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3b6b,#ffb03a);box-shadow:0 0 10px rgba(255,70,110,.7)"></i></div>
  </div>
  <div style="flex:1"></div>

  <div class="resRow">
    <div class="res min">💎 <b id="resMin">0</b></div>
    <div class="res gas">⛽ <b id="resGas">0</b></div>
    <div class="res gem">💠 <b id="resGem">0</b></div>
    <div class="res kill">☠ <b id="resKill">0</b></div>
  </div>
  <div class="coreWrap">
    <div class="coreLabel"><span>내 섬 코어</span><b id="coreTxt">80 / 80</b></div>
    <div class="coreBar"><i id="coreFill"></i></div>
  </div>
  <div class="actRow">
    <button class="act" id="btnView"><b>🔭</b><span>5섬 보기</span></button>
    <button class="act" id="btnMode"><b>🔄</b><span>병력</span></button>

/* ---------- 머티리얼 캐시 ---------- */
const matCache = {};
function MAT(color, opts){
  opts = opts || {};
  const key = color + '|' + JSON.stringify(opts);
  if(matCache[key]) return matCache[key];
  const m = new THREE.MeshStandardMaterial({
    color:color,
    metalness:(opts.metal === undefined ? 0.38 : opts.metal),
    roughness:(opts.rough === undefined ? 0.48 : opts.rough),
    emissive:(opts.emissive === undefined ? 0x000000 : opts.emissive),
    emissiveIntensity:(opts.ei === undefined ? 1 : opts.ei),
    transparent:!!opts.transparent,
    opacity:(opts.opacity === undefined ? 1 : opts.opacity),
    flatShading:!!opts.flat,
    envMapIntensity:(opts.env === undefined ? 0.45 : opts.env)
  });
  matCache[key] = m;
  return m;
}
function MESH(color){
  const m = new THREE.MeshBasicMaterial({ color:color, transparent:true, opacity:0.9, blending:THREE.AdditiveBlending, depthWrite:false });
  return m;
}

/* ---------- 지오메트리 캐시 ---------- */
const geoCache = {};
function GEO(key, make){
  if(!geoCache[key]) geoCache[key] = make();
  return geoCache[key];
}
const BOX = function(){ return GEO('box', function(){ return new THREE.BoxGeometry(1,1,1); }); };
const SPH = function(){ return GEO('sph', function(){ return new THREE.SphereGeometry(1, 12, 9); }); };
const CYL = function(){ return GEO('cyl', function(){ return new THREE.CylinderGeometry(1,1,1,12); }); };
const CONE = function(){ return GEO('cone', function(){ return new THREE.CylinderGeometry(0,1,1,10); }); };
const TOR = function(){ return GEO('tor', function(){ return new THREE.TorusGeometry(1, 0.08, 8, 22); }); };
const OCT = function(){ return GEO('oct', function(){ return new THREE.OctahedronGeometry(1, 0); }); };
const PLANE = function(){ return GEO('plane', function(){ return new THREE.PlaneGeometry(1,1); }); };

/* parts helper */
function part(parent, geo, color, opts, px, py, pz, sx, sy, sz){
  const m = new THREE.Mesh(geo, MAT(color, opts));
  m.position.set(px||0, py||0, pz||0);
  m.scale.set(sx===undefined?1:sx, sy===undefined?1:sy, sz===undefined?1:sz);
  parent.add(m);
  return m;
}
function glowPart(parent, color, px, py, pz, sx, sy, sz){
  const mat = new THREE.MeshBasicMaterial({ color:color, transparent:true, opacity:0.32, blending:THREE.AdditiveBlending, depthWrite:false });

}

/* ============================================================

function canvasTex(w, h, draw, repX, repY){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repX||1, repY||1);
  t.anisotropy = 4;
  if(THREE.sRGBEncoding !== undefined) t.encoding = THREE.sRGBEncoding;
  return t;
}

/* 바닥 격자 패널 */
const gridTex = canvasTex(256, 256, function(g,w,h){
  // 어두운 건메탈 패널
  const lg = g.createLinearGradient(0,0,w,h);
  lg.addColorStop(0,'#242f39');
  lg.addColorStop(0.5,'#1d2730');
  lg.addColorStop(1,'#151d24');
  g.fillStyle = lg; g.fillRect(0,0,w,h);

  // 브러시드 메탈 스트라이프
  for(let i=0;i<70;i++){
    const y = (i*37)%h;
    g.strokeStyle = 'rgba(190,225,240,' + (0.012 + (i%5)*0.004) + ')';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(0, y); g.lineTo(w, y + 3); g.stroke();
  }

  // 패널 이음새 (두꺼운 홈 + 얇은 하이라이트)
  g.strokeStyle = 'rgba(3,7,10,.95)'; g.lineWidth = 6;
  g.strokeRect(0,0,w,h);
  g.strokeStyle = 'rgba(130,190,215,.10)'; g.lineWidth = 2;
  g.strokeRect(4,4,w-8,h-8);

  // 내부 분할 패널
  g.strokeStyle = 'rgba(4,9,13,.8)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(w/2, 6); g.lineTo(w/2, h-6); g.moveTo(6, h/2); g.lineTo(w-6, h/2); g.stroke();
  g.strokeStyle = 'rgba(110,170,195,.06)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(w/2+3, 6); g.lineTo(w/2+3, h-6); g.moveTo(6, h/2+3); g.lineTo(w-6, h/2+3); g.stroke();

  // 모서리 볼트
  for(let i=0;i<4;i++){
    const bx = 16 + (i%2)*(w-32), by = 16 + Math.floor(i/2)*(h-32);
    g.fillStyle = 'rgba(8,13,17,.9)'; g.beginPath(); g.arc(bx, by, 4.5, 0, TAU); g.fill();
    g.fillStyle = 'rgba(170,205,225,.45)'; g.beginPath(); g.arc(bx-0.6, by-0.6, 2.6, 0, TAU); g.fill();
  }

  // 경고 스트라이프 (한쪽 모서리)
  g.save();
  g.globalAlpha = 0.10;
  g.strokeStyle = '#ffc24d'; g.lineWidth = 4;
  for(let i=-h;i<w;i+=14){ g.beginPath(); g.moveTo(i, h); g.lineTo(i+h, 0); g.stroke(); }
  g.restore();

  // 스크래치
  for(let i=0;i<26;i++){
    const x = ((i*97)%(w-20))+10, y = ((i*61)%(h-20))+10;
    g.strokeStyle = 'rgba(210,240,255,' + (0.03 + (i%4)*0.015) + ')';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x + ((i*13)%30) - 15, y + ((i*7)%18) - 9); g.stroke();
  }
}, 5, 9);

function starPips(root, n, accent){
  for(let i=0;i<n;i++){
    const a = -0.6 + i*0.6;
    const m = new THREE.Mesh(OCT(), new THREE.MeshBasicMaterial({ color:accent, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false }));
    m.scale.setScalar(0.05);
    m.position.set(Math.cos(a)*0.48, 0.30, Math.sin(a)*0.48);
    root.add(m);
  }
}

function turretBase(root, accent, r){
  const base = new THREE.Mesh(CYL(), MAT(0x333f4a, {metal:.55, rough:.40}));
  base.scale.set((r||0.44)*0.92, 0.09, (r||0.44)*0.92);
  base.position.y = 0.11;
  root.add(base);
  const ring = new THREE.Mesh(new THREE.TorusGeometry((r||0.44)*0.94, 0.016, 6, 26), new THREE.MeshBasicMaterial({ color:accent, transparent:true, opacity:0.95, depthWrite:false }));
  ring.rotation.x = -Math.PI/2; ring.position.y = 0.155;
  root.add(ring);
  // 등급 오라 (바닥에 등급색이 번짐)
  const aura = new THREE.Mesh(new THREE.RingGeometry((r||0.44)*1.02, (r||0.44)*1.35, 28), new THREE.MeshBasicMaterial({ color:accent, transparent:true, opacity:0.26, blending:THREE.AdditiveBlending, side:THREE.DoubleSide, depthWrite:false }));
  aura.rotation.x = -Math.PI/2; aura.position.y = 0.05;
  root.add(aura);
  for(let i=0;i<4;i++){
    const a = i*TAU/4 + 0.5;

  }
}

function makeSpaceTex(){
  const c = document.createElement('canvas');
  c.width = 2048; c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = '#03050c'; g.fillRect(0,0,2048,1024);
  // 성운
  const nebs = [
    ['120,70,255', 300, 380, 460, .30], ['40,150,255', 760, 240, 430, .26],
    ['255,70,160', 1420, 560, 480, .18], ['60,220,255', 1020, 780, 400, .20],
    ['150,90,255', 1760, 300, 380, .22], ['255,170,80', 480, 780, 300, .10]
  ];
  nebs.forEach(function(n){
    const rg = g.createRadialGradient(n[1], n[2], 0, n[1], n[2], n[3]);
    rg.addColorStop(0, 'rgba('+n[0]+','+n[4]+')');
    rg.addColorStop(0.45, 'rgba('+n[0]+','+(n[4]*0.35).toFixed(3)+')');
    rg.addColorStop(1, 'rgba('+n[0]+',0)');
    g.fillStyle = rg; g.fillRect(n[1]-n[3], n[2]-n[3], n[3]*2, n[3]*2);
  });
  // 별
  for(let i=0;i<2600;i++){
    const x = Math.random()*2048, y = Math.random()*1024;
    const r = Math.random()*1.35 + 0.15;
    const a = 0.18 + Math.random()*0.8;
    g.fillStyle = 'rgba('+(210+Math.random()*45|0)+','+(225+Math.random()*30|0)+',255,'+a.toFixed(2)+')';
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  // 밝은 별 십자 광채
  for(let i=0;i<70;i++){
    const x = Math.random()*2048, y = Math.random()*1024, s = 3+Math.random()*7;
    const rg = g.createRadialGradient(x,y,0,x,y,s*2.4);
    rg.addColorStop(0,'rgba(255,255,255,.95)'); rg.addColorStop(1,'rgba(150,210,255,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(x,y,s*2.4,0,TAU); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  if(THREE.sRGBEncoding !== undefined) t.encoding = THREE.sRGBEncoding;
  return t;
}

function makeRockTex(){
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#232a33'; g.fillRect(0,0,512,512);
  for(let i=0;i<900;i++){
    const x = Math.random()*512, y = Math.random()*512, r = Math.random()*16+2;
    const v = 30 + Math.random()*45 | 0;
    g.fillStyle = 'rgba('+v+','+(v+6)+','+(v+12)+','+(0.10+Math.random()*0.22).toFixed(2)+')';
    g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
  }
  // 균열
  for(let i=0;i<26;i++){
    g.strokeStyle = 'rgba(6,10,16,'+(0.35+Math.random()*0.4).toFixed(2)+')';
    g.lineWidth = 1 + Math.random()*3.4;
    g.beginPath();
    let x = Math.random()*512, y = Math.random()*512;
    g.moveTo(x,y);
    for(let k=0;k<5;k++){ x += rnd(-46,46); y += rnd(-46,46); g.lineTo(x,y); }
    g.stroke();
  }
  // 결정 광맥
  for(let i=0;i<22;i++){
    const x = Math.random()*512, y = Math.random()*512;
    g.strokeStyle = 'rgba(120,210,255,'+(0.10+Math.random()*0.22).toFixed(2)+')';
    g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+rnd(-30,30), y+rnd(-30,30)); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2.2, 1.6);
  if(THREE.sRGBEncoding !== undefined) t.encoding = THREE.sRGBEncoding;
  return t;
}

/* 문양(소환진) 텍스처 */
function makeRuneTex(){
  const c = document.createElement('canvas'); c.width = 1024; c.height = 1024;
  const g = c.getContext('2d');
  g.clearRect(0,0,1024,1024);
  g.translate(512,512);
  const ring = function(r, w, a, col){
    g.strokeStyle = 'rgba('+col+','+a+')'; g.lineWidth = w;
    g.beginPath(); g.arc(0,0,r,0,TAU); g.stroke();
  };
  ring(470, 6, .85, '170,240,255');
  ring(430, 22, .40, '90,200,255');
  ring(392, 4, 1.0, '230,252,255');
  ring(300, 6, .8, '180,140,255');
  ring(206, 16, .40, '120,220,255');
  ring(150, 4, .95, '235,252,255');
  // 5각 별
  g.strokeStyle = 'rgba(170,240,255,.9)'; g.lineWidth = 7;
  for(let k=0;k<5;k++){
    const a1 = -Math.PI/2 + k*TAU/5, a2 = a1 + TAU*2/5;
    g.beginPath();
    g.moveTo(Math.cos(a1)*420, Math.sin(a1)*420);
    g.lineTo(Math.cos(a2)*420, Math.sin(a2)*420);
    g.stroke();
  }
  // 룬 글자
  g.fillStyle = 'rgba(210,246,255,.85)';
  for(let k=0;k<40;k++){
    const a = k*TAU/40, r = 340 + (k%2?0:26);
    g.save(); g.translate(Math.cos(a)*r, Math.sin(a)*r); g.rotate(a+Math.PI/2);
    g.fillRect(-2, -10, 4, 20); g.fillRect(-8, -6, 16, 4);
    g.restore();
  }
  // 바깥 5개 노드
  for(let k=0;k<5;k++){
    const a = -Math.PI/2 + k*TAU/5;
    const x = Math.cos(a)*470, y = Math.sin(a)*470;
    const rg = g.createRadialGradient(x,y,0,x,y,60);
    rg.addColorStop(0,'rgba(220,250,255,.9)'); rg.addColorStop(1,'rgba(90,200,255,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(x,y,60,0,TAU); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  if(THREE.sRGBEncoding !== undefined) t.encoding = THREE.sRGBEncoding;
  return t;
}

  return g;

      spin.push({ o:pod, sy:0.8 + i*0.1 });
      glowPart(g, glow, Math.cos(a)*rr, 2.15, Math.sin(a)*rr, 0.1, 0.5, 0.1);
    }
    const spores = glowSprite(glow, 7, 0.22); spores.position.y = 2.4; g.add(spores);
  }
  else {
    /* 드론 캐리어 */
    part(g, new THREE.CylinderGeometry(2.7, 2.2, 0.6, 6), metal, { metal:0.7, rough:0.35, flat:true }, 0, 0.6, 0, 1, 1, 1);
    part(g, new THREE.CylinderGeometry(1.5, 2.0, 0.9, 6), dark, { metal:0.8, rough:0.3, flat:true }, 0, 1.3, 0, 1, 1, 1);
    const ringG = new THREE.Group(); ringG.position.y = 1.5;
    const ring = new THREE.Mesh(new THREE.TorusGeometry(2.3, 0.10, 6, 44),
      new THREE.MeshStandardMaterial({ color:metal, metalness:0.8, roughness:0.3 }));
    ring.rotation.x = Math.PI/2; ringG.add(ring);
    for(let i=0;i<6;i++){
      const a = i*TAU/6;
      const blk = part(ringG, BOX(), glow, { metal:0.2, rough:0.3, emissive:glow, ei:1.0 }, Math.cos(a)*2.3, 0, Math.sin(a)*2.3, 0.34, 0.10, 0.14);
      blk.rotation.y = -a;
    }
    g.add(ringG); spin.push({ o:ringG, sy:0.7 });
    const core = new THREE.Mesh(SPH(), new THREE.MeshBasicMaterial({ color:0xd8fbff, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false }));
    core.scale.setScalar(0.55); core.position.y = 2.6; g.add(core);
    const cg = glowSprite(glow, 6, 0.3); cg.position.y = 2.6; g.add(cg);
    for(let i=0;i<4;i++){
      const a = i*TAU/4 + 0.4;
      const drone = new THREE.Group();
      drone.position.set(Math.cos(a)*3.3, 2.1, Math.sin(a)*3.3);
      part(drone, OCT(), 0x9fe8ff, { metal:0.4, rough:0.25, emissive:glow, ei:0.9 }, 0, 0, 0, 0.20, 0.14, 0.20);
      const wing = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.02, 4, 12), new THREE.MeshBasicMaterial({ color:glow, transparent:true, opacity:0.6, blending:THREE.AdditiveBlending, depthWrite:false }));
      wing.rotation.x = Math.PI/2; drone.add(wing);
      g.add(drone);
      spin.push({ o:drone, sy:1.1, orbit:3.3, baseY:2.1, baseA:a });
    }
    glowPart(g, glow, 0, 1.6, 1.45, 1.2, 0.03, 0.02);
  }
  g.userData.spin = spin;
  return g;
}

const TILEDEF = { x:0, z:0, col:0, row:0, kind:'build' };
const gridGroup = new THREE.Group();
const tileMeshes = [];
function cellLocal(col, row){
  return { x:(col - (GRID_N-1)/2) * TILE, z:(row - (GRID_N-1)/2) * TILE };
}
function isCoreCell(col, row){
  return (col === 2 || col === 3) && (row === 2 || row === 3);
}
function buildGrid(playerIsland){
  const tileGeo = new THREE.BoxGeometry(TILE*0.94, 0.16, TILE*0.94);
  const edgeGeo = new THREE.BoxGeometry(TILE*0.94, 0.02, TILE*0.06);
  for(let row=0; row<GRID_N; row++){
    for(let col=0; col<GRID_N; col++){
      if(isCoreCell(col,row)) continue;
      const p = cellLocal(col,row);
      const mat = new THREE.MeshStandardMaterial({
        color:0x18222d, metalness:0.72, roughness:0.52,
        emissive:0x0a2230, emissiveIntensity:0.16
      });
      const m = new THREE.Mesh(tileGeo, mat);
      m.position.set(p.x, 0.12, p.z);
      gridGroup.add(m);
      // 발광 테두리 4변
      const em = new THREE.MeshBasicMaterial({ color:0x6fe8ff, transparent:true, opacity:0.30, blending:THREE.AdditiveBlending, depthWrite:false });
      [[0,TILE*0.47,0,1],[0,-TILE*0.47,0,1],[TILE*0.47,0,1,0],[-TILE*0.47,0,1,0]].forEach(function(e){
        const b = new THREE.Mesh(edgeGeo, em);
        b.position.set(p.x + e[0], 0.205, p.z + e[1]);
        if(e[2]) b.rotation.y = Math.PI/2;
        gridGroup.add(b);
      });
      const rec = { mesh:m, mat:mat, edgeMat:em, col:col, row:row, x:p.x, z:p.z, kind:'build', tur:null };
      m.userData.tile = rec;
      tileMeshes.push(rec);
    }
  }
  // 중앙 코어 패드
  const cp = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.4, 0.30, 24),
    new THREE.MeshStandardMaterial({ color:0x16202a, metalness:0.9, roughness:0.35, emissive:0x0d3348, emissiveIntensity:1 }));
  cp.position.y = 0.15;
  gridGroup.add(cp);
  const cRing = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.07, 6, 48),
    new THREE.MeshBasicMaterial({ color:0x63e8ff, transparent:true, opacity:0.8, blending:THREE.AdditiveBlending, depthWrite:false }));
  cRing.rotation.x = Math.PI/2; cRing.position.y = 0.30;
  gridGroup.add(cRing);
  playerIsland.add(gridGroup);
  return gridGroup;
}

      const ray = part(wing, CONE(), 0xff4b78, { metal:0.15, rough:0.2, emissive:0xff2a5a, ei:0.8, transparent:true, opacity:0.5 }, sd*k*1.0, k*0.3, 0, 0.16, 4.4 - k*0.6, 0.16);
      ray.rotation.z = sd*(1.05 + k*0.10); ray.rotation.x = -0.3;
    }
    g.add(wing); spin.push({ o:wing, flap:true, side:sd });
  }
  /* 다리/꼬리 */
  for(let sd=-1; sd<=1; sd+=2){
    const leg = new THREE.Group();
    leg.position.set(sd*1.15, -3.0, 0);
    part(leg, BOX(), plate, { metal:0.9, rough:0.28, flat:true }, 0, -1.1, 0, 0.6, 2.3, 0.6);
    for(let f=-1;f<=1;f++) part(leg, CONE(), 0xffe2ea, { metal:0.5, rough:0.3, emissive:accent, ei:0.6 }, f*0.26, -2.4, 0.35, 0.12, 0.8, 0.12).rotation.x = 0.6;
    g.add(leg); spin.push({ o:leg, sway:true, side:sd });
  }
  /* 어깨 포대 */
  for(let sd=-1; sd<=1; sd+=2){
    const cannon = new THREE.Group();
    cannon.position.set(sd*2.9, 2.5, 0.9);
    part(cannon, CYL(), 0x2a2230, { metal:0.9, rough:0.25 }, 0, 0, 0, 0.30, 1.5, 0.30).rotation.x = Math.PI/2;
    glowPart(cannon, gold, 0, 0, 0.8, 0.22, 0.22, 0.05);
    g.add(cannon); spin.push({ o:cannon, aim:true, side:sd });
  }
  /* 주위를 도는 룬 파편 */
  for(let i=0;i<14;i++){
    const a = i*TAU/14, r = 5.2 + (i%3)*0.7;
    const sh = new THREE.Mesh(new THREE.OctahedronGeometry(0.22, 0),
      new THREE.MeshBasicMaterial({ color:i%2?gold:accent, transparent:true, opacity:0.9, blending:THREE.AdditiveBlending, depthWrite:false }));
    sh.position.set(Math.cos(a)*r, rnd(-1.6,2.6), Math.sin(a)*r);
    g.add(sh);
    spin.push({ o:sh, orbit:r, baseA:a, baseY:sh.position.y, sy:0.4 });
  }
  /* 오라 링 */
  const aura = new THREE.Mesh(new THREE.RingGeometry(4.6, 7.6, 60),
    new THREE.MeshBasicMaterial({ color:0xff3b6b, transparent:true, opacity:0.18, blending:THREE.AdditiveBlending, side:THREE.DoubleSide, depthWrite:false }));
  aura.rotation.x = -Math.PI/2; aura.position.y = -4.2;
  g.add(aura); spin.push({ o:aura, sy:0.28 });

  g.userData.spin = spin;
  g.scale.setScalar(1.0);
  g.position.set(0, 27, 0);
  g.visible = false;
  centerGroup.add(g);
  bossGroup = g;
  return g;
}

const CAM = {
  mode:'islands',
  pos:new THREE.Vector3(0, 70, 110),
  look:new THREE.Vector3(0, 2, 8),
  shake:0, shakeT:0, drift:0
};
const camTargetPos = new THREE.Vector3();
const camTargetLook = new THREE.Vector3();

function projectFit(radius, centerY, elev, biasZ, margin){
  const vfov = camera.fov * Math.PI/180;
  const hfov = 2*Math.atan(Math.tan(vfov/2)*camera.aspect);
  const half = Math.min(vfov, hfov) * 0.5;
  const dist = (radius * (margin||1.03)) / Math.max(0.06, Math.sin(half));
  const dir = new THREE.Vector3(0, Math.sin(elev), Math.cos(elev));
  camTargetPos.set(0, centerY, biasZ||0).add(dir.multiplyScalar(dist));
  camTargetLook.set(0, centerY*0.6, (biasZ||0) + 2);
}
function fitCamera(mode, instant){
  CAM.mode = mode;
  if(mode === 'boss'){
    const vfov = camera.fov * Math.PI/180;
    const hfov = 2*Math.atan(Math.tan(vfov/2)*camera.aspect);
    const dist = Math.max(86, 26 / Math.max(0.05, Math.tan(hfov/2)));
    const dir = new THREE.Vector3(0, Math.sin(0.42), Math.cos(0.42));
    const tgt = new THREE.Vector3(0, 16, 6);
    camTargetPos.copy(tgt).add(dir.multiplyScalar(dist));
    camTargetLook.copy(tgt);
    return;
  }
  if(mode === 'islands'){
    const wide = camera.aspect < 0.75;
    projectFit(wide ? 35 : 29, 8, wide ? 0.84 : 0.72, 4, wide ? 1.0 : 0.98);
  } else {
    projectFit(10.4, 2.5, 0.95, 0, 0);
    const dir = new THREE.Vector3(0, Math.sin(0.95), Math.cos(0.95));
    const vfov = camera.fov * Math.PI/180;
    const hfov = 2*Math.atan(Math.tan(vfov/2)*camera.aspect);
    const half = Math.min(vfov, hfov)*0.5;
    const dist = 10.4 / Math.max(0.06, Math.sin(half));
    camTargetPos.copy(PLAYER_POS).add(dir.multiplyScalar(dist));
    camTargetLook.copy(PLAYER_POS).add(new THREE.Vector3(0, 0.9, 0));
  }
  if(instant){
    CAM.pos.copy(camTargetPos); CAM.look.copy(camTargetLook);
  }
}
function updateCamera(dt, t){
  const k = 1 - Math.pow(0.0025, dt);
  CAM.pos.lerp(camTargetPos, k);
  CAM.look.lerp(camTargetLook, k);
  let sx = 0, sy = 0;
  if(CAM.shake > 0.001){
    CAM.shakeT += dt*38;
    sx = Math.cos(CAM.shakeT*1.7)*CAM.shake;
    sy = Math.sin(CAM.shakeT*2.3)*CAM.shake*0.7;
    CAM.shake *= Math.pow(0.02, dt);
  }
  // 미세한 유영 (우주 부유감)
  const dy = Math.sin(t*0.22)*0.5, dx = Math.cos(t*0.17)*0.35;
  camera.position.set(CAM.pos.x + sx + dx, CAM.pos.y + sy + dy, CAM.pos.z);
  camera.lookAt(CAM.look.x + sx*0.4, CAM.look.y + sy*0.4, CAM.look.z);
}
function screenShake(amount){
  CAM.shake = Math.max(CAM.shake, amount);
}

   그리드 경로 (BFS 플로우 필드)
   ============================================================ */
const GRID_DIST = new Array(36).fill(99);
const GATES = [
  { name:'북', col:2, row:0, x:0, z:-1, angle:0 },
  { name:'동', col:5, row:2, x:1, z:0, angle:1 },
  { name:'남', col:2, row:5, x:0, z:1, angle:2 },
  { name:'서', col:0, row:2, x:-1, z:0, angle:3 }
];
const GATE_UNLOCK = [1, 9, 19, 29];
let gatePaths = [];

function buildFlowField(){
  for(let i=0;i<36;i++) GRID_DIST[i] = 99;
  const q = [];
  for(let r=2;r<4;r++) for(let c=2;c<4;c++){ GRID_DIST[r*6+c] = 0; q.push([c,r]); }
  for(let i=0;i<q.length;i++){
    const c = q[i][0], r = q[i][1];
    const d = GRID_DIST[r*6+c];
    const nb = [[c+1,r],[c-1,r],[c,r+1],[c,r-1]];
    for(let k=0;k<4;k++){
      const nc = nb[k][0], nr = nb[k][1];
      if(nc<0||nr<0||nc>5||nr>5) continue;
      if(GRID_DIST[nr*6+nc] <= d+1) continue;
      GRID_DIST[nr*6+nc] = d+1;
      q.push([nc,nr]);
    }
  }
  gatePaths = GATES.map(function(gt){
    const pts = [];
    let c = gt.col, r = gt.row, guard = 0;
    const outer = new THREE.Vector3(gt.x*6.6, 0.62, gt.z*6.6);
    pts.push(outer);
    while(guard++ < 40){
      const p = cellLocal(c,r);
      pts.push(new THREE.Vector3(p.x, 0.62, p.z));
      if(GRID_DIST[r*6+c] === 0) break;
      const nb = [[c+1,r],[c-1,r],[c,r+1],[c,r-1]];
      let best = null;
      for(let k=0;k<4;k++){
        const nc = nb[k][0], nr = nb[k][1];
        if(nc<0||nr<0||nc>5||nr>5) continue;
        if(GRID_DIST[nr*6+nc] === GRID_DIST[r*6+c]-1){ best = [nc,nr]; break; }
      }
      if(!best) break;
      c = best[0]; r = best[1];
    }
    const last = pts[pts.length-1];
    pts.push(new THREE.Vector3(last.x*0.42, 0.66, last.z*0.42));
    return pts;
  });
}

const trackTex = canvasTex(64, 128, function(g,w,h){
  g.fillStyle = 'rgba(6,14,22,0.55)'; g.fillRect(0,0,w,h);
  g.fillStyle = 'rgba(26,70,96,0.30)'; g.fillRect(4,0,w-8,h);
  g.strokeStyle = 'rgba(140,230,255,0.95)'; g.lineWidth = 6; g.lineCap = 'round'; g.lineJoin = 'round';
  for(let y=0; y<h; y+=64){
    g.beginPath();

/* 경로 리본 */
function makeRibbon(pts, width){
  const pos = [], uv = [], idx = [];
  let len = 0;
  for(let i=0;i<pts.length-1;i++){
    const a = pts[i], b = pts[i+1];
    const dx = b.x-a.x, dz = b.z-a.z;
    const d = Math.hypot(dx,dz) || 1;
    const nx = -dz/d*width*0.5, nz = dx/d*width*0.5;
    const v0 = len/2, v1 = (len+d)/2;
    len += d;
    const base = pos.length/3;
    pos.push(a.x+nx, 0.245, a.z+nz, a.x-nx, 0.245, a.z-nz, b.x+nx, 0.245, b.z+nz, b.x-nx, 0.245, b.z-nz);
    uv.push(0,v0, 1,v0, 0,v1, 1,v1);
    idx.push(base, base+1, base+2, base+2, base+1, base+3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  return geo;
}
function drawPaths(){
  for(let i=0;i<pathLines.length;i++){ playerIsland.remove(pathLines[i]); }
  pathLines.length = 0;
  for(let g=0; g<gatePaths.length; g++){
    const pts = gatePaths[g];
    const geo = makeRibbon(pts, 0.62);
    const tex = trackTex.clone(); tex.needsUpdate = true;
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(1,1);
    const mat = new THREE.MeshBasicMaterial({ map:tex, transparent:true, opacity:0.9, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide });
    const mesh = new THREE.Mesh(geo, mat);
    playerIsland.add(mesh);
    pathLines.push(mesh);
  }
}

      r.mesh.material.opacity = 0.9*(1-k);

  for(let i=S.lines.length-1;i>=0;i--){

const TURRET_RANGE_UNIT = 2.05;
let turretProtoCache = {};

function turretForm(t){ return FORMS[t.race][t.form]; }

function turretStats(t){
  const b = TDEF[t.tier][t.kind];
  const r = RACES[t.race] || RACES[P.race];
  const f = turretForm(t);
  const starMul = 1 + 0.35*(t.star||0);
  const fuseMul = t.fused ? 2.35 : 1;
  const dmg = b.dmg * f.dmg * starMul * fuseMul * r.atk * upgAtk() * (S.boost>0 ? 2 : 1);
  const haste = (S.buffSpd > 0 ? 1.9 : 1);
  const cd = b.cd * f.cd / (r.spd * upgSpd() * haste * (t.fused?1.18:1));
  const range = b.range * f.range * r.range * TURRET_RANGE_UNIT;
  return { dmg:dmg, cd:Math.max(0.045, cd), range:range, splash:b.splash*(t.fused?1.35:1), proj:b.proj, shots:b.shots, burst:b.burst, air:b.air, spd:b.spd };
}

function cellOccupied(col, row){
  for(let i=0;i<S.turrets.length;i++){
    if(S.turrets[i].col === col && S.turrets[i].row === row) return S.turrets[i];
  }
  return null;
}

function placeTurret(col, row, tier, kind, race, opts){
  if(isCoreCell(col,row)) return null;
  if(cellOccupied(col,row)) return null;
  opts = opts || {};
  const t = {
    id:'t'+(Date.now()%100000)+Math.floor(Math.random()*999),
    col:col, row:row, tier:tier, kind:kind,
    race:race || P.race, form:S.mode, star:0, fused:false, recipe:null,
    cd:0, cdT:0, angle:0, kills:0, dmg:0, born:S.time
  };
  const p = cellLocal(col,row);
  t.x = p.x; t.z = p.z;
  const mesh = makeTurretMesh(t);
  mesh.position.set(p.x, 0.42, p.z);
  mesh.rotation.y = Math.random()*TAU;
  playerIsland.add(mesh);

  S.turrets.push(t);

}

function refreshTurretMesh(t){
  if(t.mesh){ playerIsland.remove(t.mesh); }
  const mesh = makeTurretMesh(t);
  mesh.position.set(t.x, 0.42, t.z);
  mesh.rotation.y = Math.random()*TAU;
  playerIsland.add(mesh);

}

function sellTurret(t){

  S.min += refund;
  removeTurret(t);
  toast('♻️ 터렛 판매 +💎'+refund);
}
function removeTurret(t){
  const i = S.turrets.indexOf(t);
  if(i >= 0) S.turrets.splice(i,1);
  if(t.mesh){ playerIsland.remove(t.mesh); }
  fxBurst(new THREE.Vector3(t.x, 0.7, t.z), 0xffc24d, 10, 3.4, 0.5);
  ringBurst(new THREE.Vector3(t.x, 0.4, t.z), 0xffc24d, 2.2, 0.4);
  if(S.sel === t) S.sel = null;
}

function canMerge(a, b){
  return a && b && a !== b && !a.fused && !b.fused && a.tier === b.tier && a.kind === b.kind &&
    (a.tier < 4 || (a.star||0) < 3);
}

function mergeTurrets(a, b){
  if(!canMerge(a, b)) return false;
  let tier = a.tier, star = a.star||0;
  if(tier < 4){ tier += 1; star = 0; }
  else { star = Math.min(3, Math.max(a.star||0, b.star||0) + 1); }
  const col = a.col, row = a.row;
  removeTurret(b);
  removeTurret(a);
  const t = placeTurret(col, row, tier, a.kind, a.race, {});
  if(t){ t.star = star; refreshTurretMesh(t); }
  S.merges++;
  beep(880, 0.12, 'triangle', 0.026);
  questBump('merges', 1);
  toast('⚡ 합성! ' + TIERS[tier].name + ' ' + TDEF[tier][a.kind].short + (star?(' ★'+star):''));
  screenShake(0.25);
  ringBurst(new THREE.Vector3(cellLocal(col,row).x, 0.5, cellLocal(col,row).z), 0xffc24d, 4.2, 0.6);
  return true;
}

function adjacent(a, b){
  return Math.abs(a.col-b.col) + Math.abs(a.row-b.row) === 1;
}

function fuseTurrets(a, b){
  const rA = a.race, rB = b.race;
  if(rA === rB) return false;
  const rec = findRecipe(rA, rB);
  if(!rec) return false;
  const col = a.col, row = a.row;
  const tier = Math.min(4, Math.max(a.tier, b.tier));
  removeTurret(b); removeTurret(a);
  const t = placeTurret(col, row, tier, 0, P.race, {});
  if(t){
    t.fused = true; t.recipe = rec; t.race = P.race; t.form = S.mode;
    refreshTurretMesh(t);
  }
  screenShake(0.55);
  beep(300, 0.18, 'sawtooth', 0.03);
  setTimeoutLocal(0.12, function(){ beep(620, 0.22, 'triangle', 0.03); });
  ringBurst(new THREE.Vector3(cellLocal(col,row).x, 0.5, cellLocal(col,row).z), 0xffc24d, 6.5, 0.9);
  fxBurst(new THREE.Vector3(cellLocal(col,row).x, 0.8, cellLocal(col,row).z), 0xffd875, 22, 6.5, 0.8);
  toast('🔀 이종족 합체! ' + rec.name);
  banner('🔀 ' + rec.name, rec.tag, 1500);
  return true;
}

function openGates(){
  const out = [];
  for(let i=0;i<4;i++) if(S.stage >= GATE_UNLOCK[i]) out.push(i);
  return out;
}
function hpScale(){
  return (15 + S.stage*4.9) * (1 + Math.max(0, S.stage-30)*0.04);
}

const enemyGroup = new THREE.Group();
function spawnEnemy(isHero){
  const st = stageTier(S.stage);
  const type = isHero ? st.hero : pick(st.types);
  const d = EDEF[type];

  start.x += rnd(-0.5,0.5); start.z += rnd(-0.5,0.5);

  if(isHero){
    const aura = new THREE.Mesh(new THREE.RingGeometry(0.9, 1.35, 32),
      new THREE.MeshBasicMaterial({ color:0xffc24d, transparent:true, opacity:0.55, blending:THREE.AdditiveBlending, side:THREE.DoubleSide, depthWrite:false }));
    aura.rotation.x = -Math.PI/2; aura.position.y = 0.1;
    mesh.add(aura);
    const crown = part(mesh, CONE(), 0xffd875, { metal:0.6, rough:0.25, emissive:0xffa020, ei:1.1 }, 0, 1.55, 0, 0.16, 0.4, 0.16);
    const gs = glowSprite(0xffb03a, 4.2, 0.45); gs.position.y = 0.9; mesh.add(gs);

  }

  const hp = EDEF[type].hp * hpScale() * (isHero ? 26 : 1);

    wi:1, path:path, spd:d.spd*1.55*(isHero?0.72:1), x:start.x, z:start.z,
    coreDmg:d.coreDmg*(isHero?6:1), air:!!d.air, slow:0, slowT:0,
    dmgTaken:0, born:S.time
  };
  S.enemies.push(e);
  return e;
}

function enemyAt(i){ return S.enemies[i]; }

function damageEnemy(e, dmg, color, isCrit){
  const mult = e.air ? 1 : 1;
  e.hp -= dmg;
  e.dmgTaken += dmg;
  S.dmg += dmg;
  if(e.hp <= 0){ killEnemy(e); return true; }

}

function killEnemy(e){
  const i = S.enemies.indexOf(e);
  if(i >= 0) S.enemies.splice(i,1);
  const col = e.hero ? 0xffc24d : (EDEF[e.type].color || 0x9fe8ff);
  const pos = e.mesh.position.clone();
  fxBurst(pos, col, e.hero?26:9, e.hero?7:4, e.hero?0.9:0.5);
  ringBurst(pos, col, e.hero?5:2.4, e.hero?0.8:0.4);
  playerIsland.remove(e.mesh);
  S.kills++;
  questBump('kills', 1);
  const gain = (1.8 + S.stage*0.28) * minMul() * (e.hero?22:1);
  S.min += gain;
  if(e.hero){
    S.gems += 1;
    P.gems += 1;
    screenShake(0.45);
    toast('👑 영웅 처치! 💠+1 · 💎+' + Math.round(gain));
  }
  if(Math.random() < 0.06) S.gas += 1;

function leakCore(e){
  const i = S.enemies.indexOf(e);
  if(i >= 0) S.enemies.splice(i,1);
  S.core -= e.coreDmg;
  S.leaks++;
  const pos = new THREE.Vector3(0, 0.8, 0);
  fxBurst(pos, 0xff5f6d, 14, 5, 0.6);
  ringBurst(pos, 0xff5f6d, 4.5, 0.55);
  screenShake(0.5);
  beep(150, 0.16, 'square', 0.03);
  playerIsland.remove(e.mesh);
  if(S.core <= 0){ S.core = 0; startRevive(); }
}

function updateEnemies(dt){
  for(let i=S.enemies.length-1;i>=0;i--){
    const e = S.enemies[i];
    if(e.slowT > 0){ e.slowT -= dt; }
    const spd = e.spd * (e.slowT>0 ? 0.55 : 1);
    const wp = e.path[e.wi];
    if(!wp){ leakCore(e); continue; }
    const dx = wp.x - e.x, dz = wp.z - e.z;
    const dist = Math.hypot(dx, dz);
    if(dist < 0.22){
      e.wi++;
      if(e.wi >= e.path.length){ leakCore(e); continue; }
    } else {
      const step = Math.min(dist, spd*dt);
      e.x += dx/dist*step; e.z += dz/dist*step;
      e.mesh.rotation.y = Math.atan2(dx, dz);
    }
    const bob = e.air ? Math.sin((S.time + i)*3.2)*0.14 + 0.28 : 0;
    e.mesh.position.set(e.x, 0.55 + bob, e.z);
    if(e.mesh.userData.spinners){
      const sp = e.mesh.userData.spinners;
      for(let k=0;k<sp.length;k++){
        const s = sp[k];
        if(s.wingSide){ s.o.rotation.z = Math.sin(S.time*9 + k)*0.35 + 0.15; }
        else if(s.ring){ s.o.rotation.z += dt*1.6; }
        else if(s.hover){ s.o.position.y = (s.baseY||0) + Math.sin(S.time*3 + k)*0.10; }
      }
    }
    if(e.hero && e.mesh.userData.aura){ e.mesh.userData.aura.rotation.z += dt*1.2; }
    // 아주 가끔 자연사 방지용 상한
  }
  // 동시 개체 상한 (스폰 지연)
  if(S.enemies.length > 42) S.spawnT = Math.max(S.spawnT, 0.06);
}

/* ---------- 스테이지 진행 ---------- */
function startStage(n){
  S.stage = n;
  S.stageClock = 0;
  S.mobsLeft = STAGE_MOBS;
  S.spawnQ = [];
  S.spawnT = 0.3;
  S.stageClearing = false;
  S.nextT = 0;
  const st = stageTier(n);
  for(let i=0;i<STAGE_MOBS-1;i++) S.spawnQ.push(false);
  S.spawnQ.push(true); // 마지막 영웅
  if(n === 1) toast('빈 타일을 탭해 터렛을 세우세요 · 4개 게이트로 몰려옵니다');
  updateGates();
}
function updateGates(){
  for(let i=0;i<gateMarkers.length;i++){
    const gm = gateMarkers[i];
    const open = S.stage >= GATE_UNLOCK[i];
    gm.open = open;
    gm.arc.material.color.setHex(open ? 0xff5f6d : 0x556680);
    gm.arc.material.opacity = open ? 0.55 : 0.16;
    gm.glow.material.color.setHex(open ? 0xff5f6d : 0x556680);
    gm.glow.material.opacity = open ? 0.22 : 0.06;
  }
}
function clearStage(){
  if(S.stageClearing) return;
  S.stageClearing = true;
  const bonus = 45 + S.stage*4;
  S.min += bonus * minMul();
  S.gas += 2 + Math.floor(S.stage*0.25);
  S.gems += (S.stage % 5 === 0) ? 2 : 0;
  P.daily.stages = (P.daily.stages||0)+1;
  questBump('stages', 1);
  banner('STAGE ' + S.stage + ' 클리어', '다음 웨이브 준비 · 💎+' + Math.round(bonus), 1500);
  screenShake(0.2);
  beep(780, 0.1, 'triangle', 0.022);
  setTimeoutLocal(0.12, function(){ beep(980, 0.12, 'triangle', 0.02); });
  S.nextT = 2.4;
  if(S.stage >= WAVE_MAX){
    S.nextT = 1.6;
    S.stageClearing = true;
  }
}
function updateStage(dt){
  if(S.phase !== 'play') return;
  S.stageClock += dt;
  // 스폰
  if(S.spawnQ.length && S.enemies.length < 42){
    S.spawnT -= dt;
    if(S.spawnT <= 0){
      const isHero = S.spawnQ.shift();
      spawnEnemy(isHero);
      S.mobsLeft = S.spawnQ.length;
      S.spawnT = isHero ? 0.9 : 0.24;
    }
  }
  if(!S.spawnQ.length && S.enemies.length === 0 && !S.stageClearing){
    clearStage();
  }
  if(S.stageClearing){
    S.nextT -= dt;
    if(S.nextT <= 0){
      if(S.stage >= WAVE_MAX){ startBossPhase(); }
      else startStage(S.stage + 1);
    }
  }
}

/* ============================================================
   투사체 / 발사
   ============================================================ */
function nearestEnemy(x, z, range){
  let best = null, bd = range*range;
  for(let i=0;i<S.enemies.length;i++){
    const e = S.enemies[i];
    const d = (e.x-x)*(e.x-x) + (e.z-z)*(e.z-z);
    if(d < bd){ bd = d; best = e; }
  }
  return best;
}

function turretFire(t, dt){
  const st = turretStats(t);
  t.cd -= dt;
  if(t.cd > 0) return;
  const target = nearestEnemy(t.x, t.z, st.range);
  if(!target) return;
  t.cd = st.cd;
  const yawG = t.mesh.userData.yaw;
  const from = new THREE.Vector3(t.x, 0.85, t.z);
  const to = new THREE.Vector3(target.x, 0.7, target.z);
  const ang = Math.atan2(to.x-from.x, to.z-from.z);
  t.angle = ang;
  if(yawG) yawG.rotation.y = ang;

  const color = t.fused ? 0xffd875 : TIERS[t.tier].hex;
  const shots = st.shots || 1;

  if(st.proj === 'beam' || st.proj === 'laser' || st.proj === 'psi'){
    beamLine(from, to, color, 0.06, 0.12);
    damageEnemy(target, st.dmg, color);
    if(st.splash > 0.3) splashDamage(to, st.splash*1.2, st.dmg*0.45, color, target);
    if(t.fused && Math.random()<0.5) chainBolt(to, 4, st.dmg*0.4, color);
    muzzleFlash(from, color, 1.4);
    return;
  }
  for(let k=0;k<shots;k++){
    setTimeoutLocal(k*0.05, function(){
      const p = new THREE.Mesh(new THREE.SphereGeometry(st.proj==='missile'?0.10:0.075, 6, 5),
        new THREE.MeshBasicMaterial({ color:color, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false }));
      p.position.copy(from);
      playerIsland.add(p);
      S.projs.push({ mesh:p, x:from.x, z:from.z, y:from.y, target:target, spd:(st.proj==='missile'?9:22), dmg:st.dmg, splash:st.splash, color:color, kind:st.proj, life:2.2, home:st.proj==='missile' });
    });
  }
  muzzleFlash(from, color, st.proj==='missile'?2.2:1.5);
}
/* 로컬 지연 타이머 (게임 배속 반영) */
let timers = [];
function setTimeoutLocal(delay, fn){ timers.push({ t:delay, fn:fn }); }
function updateTimers(dt){
  for(let i=timers.length-1;i>=0;i--){
    timers[i].t -= dt;
    if(timers[i].t <= 0){ const f = timers[i].fn; timers.splice(i,1); f(); }
  }
}

function splashDamage(pos, radiusR, dmg, color, skip){
  const r = radiusR * 1.7;
  for(let i=S.enemies.length-1;i>=0;i--){
    const e = S.enemies[i];
    if(e === skip) continue;
    const d = Math.hypot(e.x-pos.x, e.z-pos.z);
    if(d <= r) damageEnemy(e, dmg * (1 - d/r*0.4), color);
  }
  ringBurst(new THREE.Vector3(pos.x, 0.5, pos.z), color, radiusR*2.4, 0.4);
}

function chainBolt(fromPos, count, dmg, color){
  let cur = { x:fromPos.x, z:fromPos.z };
  const hit = [];
  for(let i=0;i<count;i++){
    let best = null, bd = 36;
    for(let k=0;k<S.enemies.length;k++){
      const e = S.enemies[k];
      if(hit.indexOf(e)>=0) continue;
      const d = (e.x-cur.x)*(e.x-cur.x)+(e.z-cur.z)*(e.z-cur.z);
      if(d < bd){ bd = d; best = e; }
    }
    if(!best) break;
    hit.push(best);
    beamLine(new THREE.Vector3(cur.x, 1.0, cur.z), new THREE.Vector3(best.x, 0.8, best.z), color, 0.05, 0.14);
    damageEnemy(best, dmg, color);
    cur = best;
  }
}

function updateProjectiles(dt){
  for(let i=S.projs.length-1;i>=0;i--){
    const p = S.projs[i];
    p.life -= dt;
    if(!p.target || p.life <= 0 || S.enemies.indexOf(p.target) < 0){
      // 목표 소멸 → 폭발 또는 제거
      if(p.splash > 0) splashDamage(new THREE.Vector3(p.x,0.6,p.z), p.splash, p.dmg*0.6, p.color);
      playerIsland.remove(p.mesh); S.projs.splice(i,1); continue;
    }
    const tx = p.target.x, tz = p.target.z;
    const dx = tx - p.x, dz = tz - p.z;
    const d = Math.hypot(dx, dz);
    if(d < 0.24){
      damageEnemy(p.target, p.dmg, p.color);
      if(p.splash > 0) splashDamage(new THREE.Vector3(tx,0.55,tz), p.splash, p.dmg*0.55, p.color, p.target);
      fxBurst(new THREE.Vector3(tx, 0.7, tz), p.color, p.kind==='missile'?9:4, 3.6, 0.4);
      playerIsland.remove(p.mesh); S.projs.splice(i,1); continue;
    }
    const step = Math.min(d, p.spd*dt);
    p.x += dx/d*step; p.z += dz/d*step;
    p.mesh.position.set(p.x, 0.85 + Math.sin(S.time*8+i)*0.03, p.z);
    p.mesh.scale.setScalar(1 + (p.life%0.2));
  }
}

   AI 4팀 (다른 4종족의 부유섬)
   ============================================================ */
function buildTeams(){
  const races = ['human','drone','mecha','arcane','bio'].filter(function(r){ return r !== P.race; });
  S.aiTeams = [];
  for(let i=0;i<4;i++){
    S.aiTeams.push({
      idx:i+1, race:races[i], name:TEAM_NAMES[i], icon:RACES[races[i]].icon,
      stage:1, progress:0, clearT:0, dmg:0, hp:100, rank:0,
      dur:rnd(16,21), dps:60, boostT:0, stunned:0
    });
  }
}
function updateAI(dt){
  for(let i=0;i<S.aiTeams.length;i++){
    const a = S.aiTeams[i];
    if(a.stunned > 0){ a.stunned -= dt; continue; }
    if(S.phase === 'win') continue;
    const speed = (a.boostT>0 ? 1.8 : 1) * (S.phase==='boss'?0.4:1);
    a.progress += dt * speed / a.dur;
    a.dps = 60 + a.stage*26;
    a.dmg += a.dps * dt * 0.6;
    if(a.progress >= 1){
      a.progress = 0;
      a.clearT += a.dur;
      if(a.stage < WAVE_MAX) a.stage++;
      a.dur = rnd(11, 17) - Math.min(5, a.stage*0.12);
      // AI 간 경쟁 알림
      if(a.stage > S.stage + 2 && Math.random() < 0.35){
        toast('⚡ ' + a.icon + a.name + ' 팀이 S' + a.stage + '로 치고 나갑니다');
      }
    }
    if(S.phase === 'boss' && S.boss) S.boss.hp -= a.dps*0.35*dt;
  }
  // AI 섬 시각 효과
  S.aiAnim += dt;
  for(let i=0;i<aiSwarm.length;i++){
    const sw = aiSwarm[i];
    const team = S.aiTeams[i];
    if(!team) continue;
    for(let k=0;k<sw.dots.length;k++){
      const d = sw.dots[k];
      if(!d.alive){ d.o.visible = false; continue; }
      d.o.visible = true;
      d.a += d.spd*dt*(team.stunned>0?0.15:1);
      d.o.position.set(Math.cos(d.a)*d.r, d.y + Math.sin(S.time*2+k)*0.1, Math.sin(d.a)*d.r);
      d.o.material.opacity = 0.55 + Math.sin(S.time*5+k)*0.3;
    }
    // 포탑 회전 + 발사
    for(let k=0;k<sw.turrets.length;k++){
      const tu = sw.turrets[k];
      const dot = sw.dots[(k*3)%sw.dots.length];
      const ang = Math.atan2(dot.o.position.x - tu.o.position.x, dot.o.position.z - tu.o.position.z);
      if(tu.o.userData.yaw) tu.o.userData.yaw.rotation.y = ang;
      if(Math.random() < dt*1.6 && team.stunned<=0){
        const from = tu.o.position.clone().add(new THREE.Vector3(0,0.8,0));
        const to = dot.o.position.clone();
        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([from, to]),
          new THREE.LineBasicMaterial({ color:RACE_STYLE[team.race].glow, transparent:true, opacity:0.9, blending:THREE.AdditiveBlending, depthWrite:false }));
        sw.island.add(line);
        S.rings.push({ sprite:null, mesh:line, t:0, dur:0.14, radius:0, parent:sw.island });
        fxBurst(to, RACE_STYLE[team.race].glow, 3, 2, 0.3);
      }
    }
  }
}

function makeBeamMesh(from, to, color, radius){
  const dir = new THREE.Vector3().subVectors(to, from);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(radius*0.55, radius, len, 6, 1, true);
  const mat = new THREE.MeshBasicMaterial({ color:color, transparent:true, opacity:0.55, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide });
  const m = new THREE.Mesh(geo, mat);
  m.position.copy(from).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  return m;
}
function startBossPhase(){
  if(S.phase === 'boss') return;
  S.phase = 'boss';
  S.boss = { hp:BOSS_HP, maxHp:BOSS_HP, t:0, atkT:5, rage:0, dead:false };
  bossGroup.visible = true;
  bossVisible = true;
  bossGroup.position.set(0, 13, 0);
  bossGroup.scale.setScalar(0.2);
  CAM.mode = 'boss';

  const bb = $('bossWrap'); if(bb) bb.style.display = 'block';

  /* 5개 섬 → 보스 상시 레이저 */
  for(let i=0;i<5;i++){
    const a = islandAngle(i);
    const rr = RING_R - (i===0 ? ISLAND_R : AI_ISLAND_R)*0.92;
    const from = new THREE.Vector3(Math.sin(a)*rr, 1.6, Math.cos(a)*rr);
    const to = new THREE.Vector3(rnd(-3,3), 26.5 + rnd(-2,2), rnd(-3,3));
    const col = i===0 ? RACE_STYLE[P.race].glow : RACE_STYLE[S.aiTeams[i-1].race].glow;
    const beam = makeBeamMesh(from, to, col, 0.55);
    world.add(beam);
    const gl = glowSprite(col, 5.5, 0.6); gl.position.copy(from); world.add(gl);
    bossBeams.push({ line:beam, from:from, to:to, ph:i*1.1, col:col, gl:gl });
  }
  screenShake(1.0);
  beep(90, 0.7, 'sawtooth', 0.045);
  // 5섬에서 중앙으로 에너지 폭발
  for(let i=0;i<5;i++){
    const a = islandAngle(i);
    fxBurst(new THREE.Vector3(Math.sin(a)*24, 1, Math.cos(a)*24), 0x9fe8ff, 20, 8, 1.0);
  }
  S.bossAnnounce = 3;
  updateGates();
}
let BOLTS = [];
function spawnBolt(){
  const fromAI = Math.random() < 0.55;
  let from;
  if(fromAI){
    const i = rndInt(0,3);
    const a = islandAngle(i+1);
    const rr3 = RING_R - AI_ISLAND_R*0.9;
    from = new THREE.Vector3(Math.sin(a)*rr3, 2.2, Math.cos(a)*rr3);
  } else if(S.turrets.length){
    const tr = S.turrets[rndInt(0, S.turrets.length-1)];
    from = playerIsland.localToWorld(new THREE.Vector3(tr.x, 0.95, tr.z));
  } else {
    const a = islandAngle(0);
    from = new THREE.Vector3(Math.sin(a)*(RING_R-ISLAND_R*0.9), 2.2, Math.cos(a)*(RING_R-ISLAND_R*0.9));
  }
  const to = new THREE.Vector3(rnd(-4,4), 26 + rnd(-3,3), rnd(-4,4));
  const col = fromAI ? 0x9fe8ff : 0xffd875;
  const spr = glowSprite(col, 5.4, 0.95);
  spr.position.copy(from);
  world.add(spr);
  const mid = from.clone().lerp(to, 0.5); mid.y += 2.5;
  BOLTS.push({ o:spr, from:from, mid:mid, to:to, t:0, dur:rnd(0.34,0.5), col:col });
}
function updateBolts(dt){
  for(let i=BOLTS.length-1;i>=0;i--){
    const b = BOLTS[i];
    b.t += dt;
    const k = clamp(b.t/b.dur, 0, 1);
    const p = new THREE.Vector3().copy(b.from).lerp(b.mid, k).lerp(new THREE.Vector3().copy(b.mid).lerp(b.to, k), k);
    b.o.position.copy(p);
    b.o.material.opacity = 0.95;
    if(k >= 1){
      world.remove(b.o);
      if(b.o.material) b.o.material.dispose();
      BOLTS.splice(i,1);
      // 임팩트
      if(S.boss && !S.boss.dead){
        S.boss.hp -= 40;
        const hit = new THREE.Vector3(rnd(-2,2), 20.4+rnd(-1.5,1.5), rnd(-2,2));
        const sp = glowSprite(0xffe08a, 4.2, 0.9);
        sp.position.copy(hit); world.add(sp);
        S.rings.push({ mesh:null, sprite:sp, t:0, dur:0.3, radius:0, parent:world });
      }
    }
  }
}
function updateBoss(dt){
  if(!S.boss) return;
  const b = S.boss;
  b.t += dt;
  const grow = Math.min(1, b.t/1.6);
  bossGroup.position.y = 25 + Math.sin(b.t*0.8)*0.6 - (1-grow)*13;
  bossGroup.scale.setScalar(2.9*(0.35 + 0.65*grow));
  bossGroup.rotation.y += dt*0.16;
  const sp = bossGroup.userData.spin || [];
  for(let i=0;i<sp.length;i++){
    const s = sp[i];
    if(s.sy) s.o.rotation.y += dt*s.sy;
    if(s.sx) s.o.rotation.x += dt*s.sx;
    if(s.pulse){ const k = 1 + Math.sin(b.t*4)*0.08; s.o.scale.setScalar(k); }
    if(s.swing) s.o.rotation.x = Math.sin(b.t*1.4 + s.ph)*0.18;
    if(s.flap) s.o.rotation.y = Math.sin(b.t*1.1 + (s.side>0?0:1.7))*0.22;
    if(s.sway) s.o.rotation.z = Math.sin(b.t*0.9 + (s.side>0?0:2.1))*0.10;
    if(s.aim) s.o.rotation.y = Math.sin(b.t*0.6 + (s.side>0?0.4:1.2))*0.5;
    if(s.orbit !== undefined){
      const a = (s.baseA||0) + b.t*0.5;
      s.o.position.set(Math.cos(a)*s.orbit, s.o.position.y, Math.sin(a)*s.orbit);
    }
  }
  const bf = $('bossFill'), bt = $('bossTxt');
  if(bf){ bf.style.width = clamp(b.hp/b.maxHp,0,1)*100 + '%'; }
  if(bt){ bt.textContent = fmtNum(Math.max(0,b.hp)) + ' / ' + fmtNum(b.maxHp) + '  ·  ' + BOSS_NAME; }
  if(bossParts.runePlane) bossParts.runePlane.rotation.z += dt*0.12;
  if(bossParts.heartGlow) bossParts.heartGlow.material.opacity = 0.24 + Math.sin(b.t*5)*0.10;
  b.beamT = (b.beamT||0) + dt;
  for(let i=0;i<bossBeams.length;i++){
    const bm = bossBeams[i];
    bm.line.material.opacity = 0.32 + Math.abs(Math.sin(b.t*2.2 + bm.ph))*0.55;
    if(b.beamT > 0.12){
      const to = new THREE.Vector3(bm.to.x + rnd(-1.6,1.6), bm.to.y + rnd(-1.6,1.6), bm.to.z + rnd(-1.6,1.6));
      world.remove(bm.line);
      bm.line.geometry.dispose(); bm.line.material.dispose();
      bm.line = makeBeamMesh(bm.from, to, bm.col, 0.55);
      world.add(bm.line);
    }
    if(bm.gl) bm.gl.material.opacity = 0.35 + Math.abs(Math.sin(b.t*4 + bm.ph))*0.4;
  }
  if(b.beamT > 0.12) b.beamT = 0;

  // 플레이어 터렛 → 보스 연합 포격
  if(b.t > 1.2){
    b.hp -= totalDps()*dt;
    b.boltT = (b.boltT||0) + dt;
    if(b.boltT > 0.075){ b.boltT = 0; spawnBolt(); spawnBolt(); }
    updateBolts(dt);
    b.salvoT = (b.salvoT||0) + dt;
    if(b.salvoT > 0.16 && S.turrets.length){
      b.salvoT = 0;
      const count = Math.min(4, S.turrets.length);
      for(let i=0;i<count;i++){
        b.salvoI = ((b.salvoI||0) + 1);
        const tr = S.turrets[b.salvoI % S.turrets.length];
        if(!tr) continue;
        const from = playerIsland.localToWorld(new THREE.Vector3(tr.x, 0.95, tr.z));
        const to = new THREE.Vector3(rnd(-5,5), 27+rnd(-7,7), rnd(-5,5));
        const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
        const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color:tr.fused?0xffd875:TIERS[tr.tier].hex, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false }));
        world.add(line);
        S.rings.push({ mesh:line, sprite:null, t:0, dur:0.34, radius:0, parent:world });
      }
      // 아군 4섬도 중앙으로 포격
      for(let i=0;i<S.aiTeams.length;i++){
        if(Math.random() > 0.45) continue;
        const a = islandAngle(i+1);
        const rr2 = RING_R - AI_ISLAND_R*0.8;
        const from = new THREE.Vector3(Math.sin(a)*rr2, 2.0, Math.cos(a)*rr2);
        const to = new THREE.Vector3(rnd(-5,5), 27+rnd(-7,7), rnd(-5,5));
        const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
        const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color:RACE_STYLE[S.aiTeams[i].race].glow, transparent:true, opacity:0.85, blending:THREE.AdditiveBlending, depthWrite:false }));
        world.add(line);
        S.rings.push({ mesh:line, sprite:null, t:0, dur:0.30, radius:0, parent:world });
        fxBurst(to, 0xffb03a, 2, 2.4, 0.3);
      }
    }
  }
  // 보스 공격
  b.atkT -= dt;
  if(b.atkT <= 0){
    b.atkT = Math.max(2.6, 6.2 - b.t*0.02);
    bossAttack();
  }
  if(b.hp <= 0 && !b.dead){
    b.dead = true;
    b.hp = 0;
    winGame();
  }
}
function totalDps(){
  let d = 0;
  for(let i=0;i<S.turrets.length;i++){ const st = turretStats(S.turrets[i]); d += st.dmg/st.cd; }
  return d;
}
function bossAttack(){
  const target = rndInt(0,4);
  const a = islandAngle(target);
  const dist = RING_R;
  const pos = new THREE.Vector3(Math.sin(a)*dist, 0.8, Math.cos(a)*dist);
  screenShake(1.1);
  banner('☄️ 오메가 강타', target===0 ? '내 섬에 직격!' : '아군 섬 피격', 1100);
  if(target === 0){
    S.core -= 14;
    fxBurst(new THREE.Vector3(rnd(-3,3),0.9,rnd(-3,3)), 0xff5f6d, 26, 8, 0.9);
    ringBurst(new THREE.Vector3(0,0.5,0), 0xff5f6d, 11, 0.9);
    if(S.core <= 0){ S.core = 0; startRevive(); }
  } else {
    const t = S.aiTeams[target-1];
    if(t){ t.hp = Math.max(18, t.hp - 22); t.stunned = 2.2; }
    fxBurst(pos, 0xff8a5f, 22, 7, 0.8);
    ringBurst(pos, 0xff8a5f, 8, 0.8);
  }
  // 보스 반격 빔
  for(let i=0;i<3;i++){
    setTimeoutLocal(i*0.12, function(){
      const ang = islandAngle(rndInt(0,4));
      const from = new THREE.Vector3(0, 27, 0);
      const to = new THREE.Vector3(Math.sin(ang)*RING_R, 1, Math.cos(ang)*RING_R);
      const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
      const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color:0xff3b6b, transparent:true, opacity:0.9, blending:THREE.AdditiveBlending, depthWrite:false }));
      world.add(line);
      S.rings.push({ mesh:line, sprite:null, t:0, dur:0.28, radius:0, parent:world });
    });
  }
}

const ray = new THREE.Raycaster();
const pointerNdc = new THREE.Vector2();
const tilePlane = new THREE.Plane(new THREE.Vector3(0,1,0), -0.35);

function pickTile(clientX, clientY){
  pointerNdc.x = (clientX/window.innerWidth)*2 - 1;
  pointerNdc.y = -(clientY/window.innerHeight)*2 + 1;
  ray.setFromCamera(pointerNdc, camera);
  const hit = new THREE.Vector3();
  if(!ray.ray.intersectPlane(tilePlane, hit)) return null;
  const lx = hit.x - PLAYER_POS.x, lz = hit.z - PLAYER_POS.z;
  if(Math.abs(lx) > GRID_N*TILE*0.55 || Math.abs(lz) > GRID_N*TILE*0.55) return null;
  const col = Math.round(lx/TILE + (GRID_N-1)/2);
  const row = Math.round(lz/TILE + (GRID_N-1)/2);
  if(col<0||row<0||col>5||row>5) return null;
  return { col:col, row:row, core:isCoreCell(col,row), tur:cellOccupied(col,row) };
}

function tapWorld(clientX, clientY){
  if(S.phase === 'intro') return;
  const t = pickTile(clientX, clientY);
  if(t){
    if(CAM.mode !== 'focus'){ fitCamera('focus'); refreshHud(); }
    if(t.core){ toast('중앙 코어는 건설할 수 없습니다'); return; }
    if(t.tur){
      const prev = S.sel;
      if(prev && prev !== t.tur){
        if(canMerge(prev, t.tur)){ mergeTurrets(prev, t.tur); closeSheet(); refreshHud(); return; }
        if(prev.race !== t.tur.race && adjacent(prev, t.tur) && !prev.fused && !t.tur.fused){
          fuseTurrets(prev, t.tur); closeSheet(); refreshHud(); return;
        }
      }
      selectTurret(t.tur);
    }
    else openBuildSheet(t.col, t.row);
    return;
  }
  // 내 섬 자체를 탭하면 집중 보기
  pointerNdc.x = (clientX/window.innerWidth)*2 - 1;
  pointerNdc.y = -(clientY/window.innerHeight)*2 + 1;
  ray.setFromCamera(pointerNdc, camera);
  const hits = ray.intersectObjects([playerIsland], true);
  if(hits.length){
    if(CAM.mode !== 'focus') fitCamera('focus');
    else closeSheet();
    refreshHud();
    return;
  }
  closeSheet();
  deselect();
}

/* ============================================================
   메인 루프
   ============================================================ */
let lastT = performance.now();
let rafId = 0;
function tick(now){
  rafId = requestAnimationFrame(tick);
  let dt = (now - lastT)/1000;
  lastT = now;
  if(dt > 0.1) dt = 0.1;
  const t = now/1000;

  /* 배경/환경 애니메이션 (배속과 무관) */
  starPts.rotation.y += dt*0.004;
  sky.rotation.y += dt*0.0016;
  updateCamera(dt, t);
  for(let i=0;i<centerRings.length;i++){
    const r = centerRings[i];
    if(r.orbit !== undefined){
      const a = (r.baseA||0) + t*0.25;
      r.o.position.set(Math.cos(a)*r.orbit, r.o.position.y, Math.sin(a)*r.orbit);
      r.o.rotation.y += dt*(r.sy||0.3);
    } else {
      r.o.rotation.z += dt*(r.sy||0);
      if(r.sx) r.o.rotation.x += dt*r.sx*0.2;
    }
  }
  if(bossParts.pillar) bossParts.pillar.material.opacity = 0.16 + Math.sin(t*1.6)*0.06;
  const tetherOn = (S.phase==='boss');
  for(let i=0;i<tetherLines.length;i++){
    tetherLines[i].material.opacity = tetherOn ? (0.55 + Math.sin(t*3 + i)*0.2) : 0.26;
    tetherLines[i].material.color.setHex(tetherOn ? 0x9fe8ff : 0x63e8ff);
  }
  // 섬 부유 애니메이션
  for(let i=0;i<ISLANDS.length;i++){
    const isl = ISLANDS[i].group ? ISLANDS[i].group.userData : {};
    if(isl.floaters){
      for(let k=0;k<isl.floaters.length;k++){
        const f = isl.floaters[k];
        f.o.position.y += Math.sin(t*f.spd + f.base)*0.0016*f.amp;
        f.o.rotation.y += dt*0.1;
      }
    }
    if(isl.shields){
      for(let k=0;k<isl.shields.length;k++) isl.shields[k].o.rotation.y += dt*isl.shields[k].spd;
    }
  }
  if(playerBase && playerBase.userData.spin){
    const sp = playerBase.userData.spin;
    for(let i=0;i<sp.length;i++){
      const s = sp[i];
      if(s.sy) s.o.rotation.y += dt*s.sy*(S.phase==='intro'?0.7:1);
      if(s.sx) s.o.rotation.x += dt*s.sx;
      if(s.orbit !== undefined){
        const a = (s.baseA||0) + t*0.8;
        s.o.position.set(Math.cos(a)*s.orbit, s.o.position.y, Math.sin(a)*s.orbit);
      }
    }
  }
  for(let i=0;i<pathLines.length;i++){
    const m = pathLines[i].material;
    if(m && m.map) m.map.offset.y -= dt*0.55;
  }
  if(coreOrb){ coreOrb.scale.setScalar(1 + Math.sin(t*2.4)*0.06); }
  for(let i=0;i<coreRings.length;i++){
    coreRings[i].o.rotation.z += dt*coreRings[i].sy;
    coreRings[i].o.rotation.x += dt*coreRings[i].sx*0.2;
  }
  if(coreGlow) coreGlow.material.opacity = 0.26 + Math.sin(t*2.8)*0.08;

  /* 게임 진행 */
  if(S.phase === 'play' || S.phase === 'boss'){
    const gdt = dt * S.speed;
    S.time += gdt;
    if(S.boss) updateBoss(gdt);
    if(S.phase === 'play') updateStage(gdt);
    updateEnemies(gdt);
    for(let i=0;i<S.turrets.length;i++) turretFire(S.turrets[i], gdt);
    updateProjectiles(gdt);
    updateFX(gdt);
    updateTimers(gdt);
    updateAI(gdt);
    // 스킬/모드 쿨
    if(S.skillT > 0) S.skillT = Math.max(0, S.skillT - gdt);
    if(S.modeCd > 0) S.modeCd = Math.max(0, S.modeCd - gdt);
    if(S.boost > 0) S.boost = Math.max(0, S.boost - gdt);
    if(S.buffSpd > 0) S.buffSpd = Math.max(0, S.buffSpd - gdt);
    if(S.hintT > 0) S.hintT -= gdt;
  } else {
    updateFX(dt);
    updateAI(dt*0.4);
    updateEnemies(dt*0.3);
    updateTimers(dt);
  }
  if(S.revive){
    S.revive.t -= dt;
    updateRevive();
    if(S.revive.t <= 0){ gameOver(); }
  }
  updateTags();
  updateDmgNumbers(dt);
  if(BOLTS.length) updateBolts(dt);
  updateFloaters(dt);
  updateStay(dt);
  refreshHudLight();
  renderer.render(scene, camera);
}

/* ---------- 데미지 넘버 (DOM) ---------- */
const dmgPool = [];
function spawnDmg(x, z, text, crit){
  const p = new THREE.Vector3(x, 1.4, z);
  p.copy(playerIsland.localToWorld(p));
  const s = worldToScreen(p);
  const el = document.createElement('div');
  el.className = 'dmgN' + (crit?' crit':'');
  el.textContent = text;
  el.style.left = '0px'; el.style.top = '0px';
  el.style.transform = 'translate(' + (s.x-10) + 'px,' + (s.y-10) + 'px)';
  document.body.appendChild(el);
  dmgPool.push({ el:el, life:0.85, x:s.x, y:s.y, vy:-46 });
}
function updateDmgNumbers(dt){
  for(let i=dmgPool.length-1;i>=0;i--){
    const d = dmgPool[i];
    d.life -= dt;
    if(d.life <= 0){ if(d.el.parentNode) d.el.parentNode.removeChild(d.el); dmgPool.splice(i,1); continue; }
    d.y += d.vy*dt;
    d.el.style.transform = 'translate(' + d.x + 'px,' + d.y + 'px)';
    d.el.style.opacity = clamp(d.life/0.5, 0, 1);
  }
}

    '<p class="sub">12초 안에 부활하면 이 판을 이어서 싸웁니다.</p>' +
    '<div id="reviveNum" style="font-size:44px;font-weight:900;color:#ff8095;text-shadow:0 0 22px rgba(255,80,110,.6);line-height:1.1">12</div>' +
    '<div style="height:8px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin:6px 0 10px"><i id="reviveBar" style="display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5f6d,#ffb03a)"></i></div>' +
    '<button class="cta gold" id="revAd" style="margin-bottom:6px"><span>📺 광고 보고 무료 부활</span><small>1회 무료</small></button>' +
    '<button class="cta" id="revTicket" style="margin-bottom:6px"><span>🎫 부활권 사용</span><small>보유 '+P.stock.revive+'장</small></button>' +
    '<button class="cta ghost" id="revGem"><span>💠 보석 5개로 즉시 부활</span><small>보유 '+P.gems+'</small></button>' +
    '</div><div class="foot">시간이 지나면 패배 처리됩니다 · 스테이지 '+S.stage+'</div>';
  openModal(html, 'reviveCard');
  $('revAd').onclick = function(){
    if(S.revivesUsed >= 1){ toast('무료 부활은 판당 1회입니다'); return; }
    S.revivesUsed++;
    doRevive();
  };
  $('revTicket').onclick = function(){
    if(P.stock.revive <= 0){ toast('부활권이 없습니다'); return; }
    P.stock.revive--; saveProfile(); doRevive();
  };
  $('revGem').onclick = function(){
    if(P.gems < 5){ toast('💠 보석이 부족합니다'); return; }
    P.gems -= 5; saveProfile(); doRevive();
  };
}
function updateRevive(){
  if(!S.revive) return;
  const k = clamp(S.revive.t/S.revive.max, 0, 1);
  const n = $('reviveNum'); if(n) n.textContent = Math.ceil(S.revive.t);
  const b = $('reviveBar'); if(b) b.style.width = (k*100)+'%';
}

/* ---------- 결과 ---------- */
